<!DOCTYPE html>
<html lang="it"><!--K04#047 - Stefano - Asteroids-->
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>Asteroids</title>
		<style>
			html,
			body{
				margin: 0;
				height: 100%;
				background: #000;
				overflow: hidden;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent
			}
			canvas{
				display: block;
				width: 100%;
				height: 100%
			}
			:root{
				--ib: 38px
			}
			@media(pointer:coarse){
				:root{
					--ib: 44px
				}
			}
			#tc{
				--u: clamp(56px, min(18vw, 22vh), 78px);
				--g: 10px;
				position: fixed;
				inset: 0;
				pointer-events: none;
				display: none
			}
			.b{
				position: absolute;
				pointer-events: auto;
				box-sizing: border-box;
				width: var(--u);
				height: var(--u);
				border-radius: 50%;
				border: 2px solid rgba(255, 255, 255, .55);
				color: #fff;
				font-family: "Courier New", monospace;
				font-weight: bold;
				font-size: calc(var(--u) * .2);
				display: flex;
				align-items: center;
				justify-content: center;
				text-align: center;
				background: rgba(255, 255, 255, .08);
				touch-action: none
			}
			.b.on{
				background: rgba(255, 255, 255, .35);
				transform: scale(.94)
			}
			#bl{
				left: calc(14px + env(safe-area-inset-left, 0px));
				bottom: calc(18px + env(safe-area-inset-bottom, 0px));
				font-size: calc(var(--u) * .36)
			}
			#br{
				left: calc(14px + var(--u) + var(--g) + env(safe-area-inset-left, 0px));
				bottom: calc(18px + env(safe-area-inset-bottom, 0px));
				font-size: calc(var(--u) * .36)
			}
			#bf{
				right: calc(14px + env(safe-area-inset-right, 0px));
				bottom: calc(18px + env(safe-area-inset-bottom, 0px));
				width: calc(var(--u) * 1.3);
				height: calc(var(--u) * 1.3)
			}
			#bt{
				left: calc(14px + (var(--u) + var(--g)) / 2 + env(safe-area-inset-left, 0px));
				bottom: calc(18px + var(--u) + var(--g) + env(safe-area-inset-bottom, 0px));
				font-size: calc(var(--u) * .36)
			}
			#bh{
				right: calc(14px + var(--u) * .275 + env(safe-area-inset-right, 0px));
				bottom: calc(18px + var(--u) * 1.3 + var(--g) + env(safe-area-inset-bottom, 0px));
				width: calc(var(--u) * .75);
				height: calc(var(--u) * .75);
				font-size: calc(var(--u) * .15)
			}
			.ib{
				position: fixed;
				top: calc(10px + env(safe-area-inset-top, 0px));
				width: var(--ib);
				height: var(--ib);
				border: 1px solid rgba(255, 255, 255, .4);
				border-radius: 8px;
				color: #fff;
				font: 18px sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(255, 255, 255, .06);
				cursor: pointer
			}
			#mu{
				right: calc(10px + env(safe-area-inset-right, 0px))
			}
			#pa{
				right: calc(18px + var(--ib) + env(safe-area-inset-right, 0px))
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<div id="tc">
			<div class="b" id="bl">&#9664;</div>
			<div class="b" id="br">&#9654;</div>
			<div class="b" id="bt">&#9650;</div>
			<div class="b" id="bf">FUOCO</div>
			<div class="b" id="bh">HYPER</div>
		</div>
		<div class="ib" id="pa">&#10074;&#10074;</div>
		<div class="ib" id="mu">&#128266;</div>
		<script>
			(() => {
				const cv = document.getElementById('c'), g = cv.getContext('2d');
				const R = Math.random, TAU = Math.PI*2, PI = Math.PI;
				const rnd = (a, b) => a + R()*(b - a);
				const coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
				let W, H, S, DPR;

				function rs(){
					DPR = Math.min(devicePixelRatio || 1, 2);
					W = innerWidth;
					H = innerHeight;
					cv.width = W*DPR;
					cv.height = H*DPR;
					S = Math.max(.65, Math.min(1.5, Math.min(W, H)/600))
				}

				addEventListener('resize', rs);

				rs();

				const wr = (v, m) => v < 0 ? v + m : v >= m ? v - m : v;

				function d2(ax, ay, bx, by){
					let dx = Math.abs(ax - bx), dy = Math.abs(ay - by);
					if(dx > W/2){
						dx = W - dx;
					}
					if(dy > H/2){
						dy = H - dy;
					}
					return dx*dx + dy*dy
				}

				let AC = null, master, noiseBuf, thG, mute = false;

				function ainit(){
					if(AC){
						if(AC.state === 'suspended'){
							AC.resume();
						}
						return
					}
					try{
						AC = new (window.AudioContext || window.webkitAudioContext)();
						master = AC.createGain();
						master.gain.value = .5;
						master.connect(AC.destination);
						noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
						const d = noiseBuf.getChannelData(0);
						for(let i = 0; i < d.length; i++){
							d[i] = R()*2 - 1;
						}
						const n = AC.createBufferSource();
						n.buffer = noiseBuf;
						n.loop = true;
						const f = AC.createBiquadFilter();
						f.type = 'lowpass';
						f.frequency.value = 240;
						thG = AC.createGain();
						thG.gain.value = 0;
						n.connect(f);
						f.connect(thG);
						thG.connect(master);
						n.start();
					}catch(e){
						AC = null
					}
				}

				function tone(f, d, type, v, f2){
					if(!AC || mute){
						return;
					}
					const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
					o.type = type || 'square';
					o.frequency.setValueAtTime(f, t);
					if(f2){
						o.frequency.exponentialRampToValueAtTime(f2, t + d);
					}
					gn.gain.setValueAtTime(v || .15, t);
					gn.gain.exponentialRampToValueAtTime(.001, t + d);
					o.connect(gn);
					gn.connect(master);
					o.start(t);
					o.stop(t + d + .02);
				}

				function boom(sz){
					if(!AC || mute){
						return;
					}
					const t = AC.currentTime, d = .22 + sz*.16, s = AC.createBufferSource();
					s.buffer = noiseBuf;
					const f = AC.createBiquadFilter();
					f.type = 'lowpass';
					f.frequency.setValueAtTime(1000, t);
					f.frequency.exponentialRampToValueAtTime(70, t + d);
					const gn = AC.createGain();
					gn.gain.setValueAtTime(.35 + sz*.12, t);
					gn.gain.exponentialRampToValueAtTime(.001, t + d);
					s.connect(f);
					f.connect(gn);
					gn.connect(master);
					s.start(t);
					s.stop(t + d + .02);
				}

				const K = {l: 0, r: 0, t: 0, f: 0};
				let hreq = false, paused = false, st = 'title', overT = 0, waveT = -1, banner = 0;
				let ship = {alive: false, x: 0, y: 0, vx: 0, vy: 0, a: -PI / 2, inv: 0, cd: 0, hc: 0, t: 0};
				let rocks = [], bul = [], ub = [], ufo = null, parts = [];
				let score = 0, hi = 0, lives = 3, wave = 0, nextLife = 10000, beatT = 1, beatI = 0, mass0 = 1, ufoT = 15, tm = 0;

				try{
					hi = +localStorage.getItem('ast_hi') || 0
				}catch(e){
				}

				const tc = document.getElementById('tc'), muB = document.getElementById('mu'), paB = document.getElementById('pa');

				function sync(){
					tc.style.display = (coarse && st === 'play') ? 'block' : 'none'
				}

				function mkRock(sz, x, y, vx, vy){
					const r = [0, 13, 26, 48][sz]*S, n = 10 + (R()*3|0), v = [];
					for(let i = 0; i < n; i++){
						const a = i/n*TAU, k = .7 + R()*.3;
						v.push([Math.cos(a)*k, Math.sin(a)*k])
					}
					return {sz, x, y, vx, vy, r, v, a: R() * TAU, w: rnd(-1, 1)};
				}

				function newWave(){
					wave++;
					banner = 2.2;
					const n = Math.min(3 + wave, 11);
					for(let i = 0; i < n; i++){
						let x, y, k = 0;
						do{
							if(R() < .5){
								x = R() < .5 ? 0 : W;
								y = R()*H
							}else{
								x = R()*W;
								y = R() < .5 ? 0 : H
							}
							k++;
						}while(ship.alive && k < 30 && d2(x, y, ship.x, ship.y) < (170*S)**2);
						const a = R()*TAU, s = rnd(35, 75)*S*(1 + Math.min(wave, 10)*.05);
						rocks.push(mkRock(3, x, y, Math.cos(a)*s, Math.sin(a)*s));
					}
					mass0 = n * 7;
				}

				function spawnShip(){
					Object.assign(ship, {alive: true, x: W/2, y: H/2, vx: 0, vy: 0, a: -PI/2, inv: 3, cd: 0, hc: 0})
				}

				function start(){
					ainit();
					score = 0;
					lives = 3;
					wave = 0;
					nextLife = 10000;
					rocks = [];
					bul = [];
					ub = [];
					ufo = null;
					parts = [];
					waveT = -1;
					ufoT = rnd(12, 20);
					beatT = 1;
					paused = false;
					spawnShip();
					newWave();
					st = 'play';
					sync();
				}

				function gameOver(){
					st = 'over';
					overT = 1.5;
					ufo = null;
					ub = [];
					sync();
					try{
						localStorage.setItem('ast_hi', hi)
					}catch(e){
					}
				}

				function addScore(n){
					score += n;
					if(score > hi){
						hi = score;
					}
					if(score >= nextLife){
						lives++;
						nextLife += 10000;
						tone(600, .12, 'square', .12);
						setTimeout(() => tone(900, .2, 'square', .12), 130)
					}
				}

				function dots(x, y, n, vx, vy){
					for(let k = 0; k < n; k++){
						const a = R()*TAU, s = rnd(30, 150)*S;
						parts.push({t: 'd', x, y, vx: Math.cos(a)*s + vx*.3, vy: Math.sin(a)*s + vy*.3, l: rnd(.4, .9), m: .9})
					}
				}

				function hit(i, pts){
					const o = rocks[i];
					rocks.splice(i, 1);
					if(pts){
						addScore([0, 100, 50, 20][o.sz]);
					}
					boom(o.sz);
					dots(o.x, o.y, 5 + o.sz * 4, o.vx, o.vy);
					if(o.sz > 1){
						for(let k = 0; k < 2; k++){
							const a = R()*TAU, c = o.sz - 1, s = (c === 2 ? 62 : 105)*S*rnd(.8, 1.3)*(1 + Math.min(wave, 10)*.04);
							rocks.push(mkRock(c, o.x, o.y, Math.cos(a)*s + o.vx*.4, Math.sin(a)*s + o.vy*.4));
						}
					}
				}

				function kill(){
					const s = ship;
					s.alive = false;
					s.t = 2.2;
					lives--;
					boom(3);
					[[14, 0, -10, -9], [-10, -9, -5, 0], [-5, 0, -10, 9], [-10, 9, 14, 0]].forEach(l => {
						const mx = (l[0] + l[2])/2, my = (l[1] + l[3])/2, c = Math.cos(s.a), sn = Math.sin(s.a);
						const wx = (mx*c - my*sn)*S, wy = (mx*sn + my*c)*S;
						parts.push({
							t: 'l', x: s.x + wx, y: s.y + wy, vx: s.vx*.5 + wx*4 + rnd(-30, 30), vy: s.vy*.5 + wy*4 + rnd(-30, 30),
							a: s.a + Math.atan2(l[3] - l[1], l[2] - l[0]), w: rnd(-4, 4), len: Math.hypot(l[2] - l[0], l[3] - l[1])*S, l: 1.8, m: 1.8
						});
					});
					dots(s.x, s.y, 12, s.vx, s.vy);
				}

				function spawnUfo(){
					const small = score >= 40000 || (score > 2500 && R() < Math.min(.8, .2 + score/40000));
					const dir = R() < .5 ? 1 : -1;
					ufo = {small, x: dir > 0 ? -30*S : W + 30*S, y: rnd(.15, .85)*H, vx: dir*(small ? 170 : 110)*S, vy: 0, r: (small ? 10 : 17)*S, ch: 1, fc: 1, sc: 0, ph: 0};
				}

				function killUfo(){
					addScore(ufo.small ? 1000 : 200);
					boom(2);
					dots(ufo.x, ufo.y, 16, ufo.vx, ufo.vy);
					ufo = null;
					ufoT = rnd(12, 22);
				}

				function safe(){
					return !rocks.some(o => d2(W/2, H/2, o.x, o.y) < (o.r + 120*S)**2) && (!ufo || d2(W/2, H/2, ufo.x, ufo.y) > (160*S)**2)}

				function drift(dt){
					for(const o of rocks){
						o.x = wr(o.x + o.vx*dt, W);
						o.y = wr(o.y + o.vy*dt, H);
						o.a += o.w*dt
					}
					for(const p of parts){
						p.x = wr(p.x + p.vx*dt, W);
						p.y = wr(p.y + p.vy*dt, H);
						p.l -= dt;
						if(p.t === 'l'){
							p.a += p.w*dt
						}
					}
					parts = parts.filter(p => p.l > 0);
				}

				function play(dt){
					const sh = ship;
					if(sh.alive){
						if(K.l){
							sh.a -= 4.6*dt;
						}
						if(K.r){
							sh.a += 4.6*dt;
						}
						if(K.t){
							sh.vx += Math.cos(sh.a)*330*S*dt;
							sh.vy += Math.sin(sh.a)*330*S*dt
						}
						const k = Math.exp(-.5*dt);
						sh.vx *= k;
						sh.vy *= k;
						const sp = Math.hypot(sh.vx, sh.vy), mx = 430*S;
						if(sp > mx){
							sh.vx *= mx/sp;
							sh.vy *= mx/sp
						}
						sh.x = wr(sh.x + sh.vx*dt, W);
						sh.y = wr(sh.y + sh.vy*dt, H);
						sh.inv -= dt;
						sh.cd -= dt;
						sh.hc -= dt;
						if(K.f && sh.cd <= 0 && bul.length < 5){
							sh.cd = .17;
							bul.push({x: sh.x + Math.cos(sh.a)*14*S, y: sh.y + Math.sin(sh.a)*14*S, vx: Math.cos(sh.a)*620*S, vy: Math.sin(sh.a)*620*S, l: .85});
							tone(900, .12, 'square', .07, 150);
						}
						if(hreq && sh.hc <= 0){
							hreq = false;
							sh.hc = 1;
							sh.x = rnd(.05, .95)*W;
							sh.y = rnd(.05, .95)*H;
							sh.vx = sh.vy = 0;
							sh.inv = Math.max(sh.inv, .4);
							if(R() < .1){
								kill();
							}else{
								tone(300, .25, 'sawtooth', .1, 1200);
							}
						}
						hreq = false;
					}else{
						sh.t -= dt;
						if(sh.t <= 0){
							if(lives <= 0){
								gameOver();
								return
							}else if(safe()){
								spawnShip()
							}
						}
					}
					for(const b of bul){
						b.x = wr(b.x + b.vx*dt, W);
						b.y = wr(b.y + b.vy*dt, H);
						b.l -= dt
					}
					for(const b of ub){
						b.x = wr(b.x + b.vx*dt, W);
						b.y = wr(b.y + b.vy*dt, H);
						b.l -= dt
					}
					for(const b of bul){
						if(b.l <= 0){
							continue;
						}
						for(let i = 0; i < rocks.length; i++){
							const o = rocks[i];
							if(d2(b.x, b.y, o.x, o.y) < (o.r*.88)**2){
								b.l = 0;
								hit(i, 1);
								break
							}
						}
						if(b.l > 0 && ufo && d2(b.x, b.y, ufo.x, ufo.y) < (ufo.r + 2*S)**2){
							b.l = 0;
							killUfo()
						}
					}
					for(const b of ub){
						for(let i = 0; i < rocks.length; i++){
							const o = rocks[i];
							if(d2(b.x, b.y, o.x, o.y) < (o.r*.88)**2){
								b.l = 0;
								hit(i, 0);
								break
							}
						}
					}
					if(sh.alive && sh.inv <= 0){
						for(let i = 0; i < rocks.length; i++){
							const o = rocks[i];
							if(d2(sh.x, sh.y, o.x, o.y) < (o.r*.88 + 9*S)**2){
								hit(i, 1);
								kill();
								break
							}
						}
						if(sh.alive){
							for(const b of ub){
								if(d2(sh.x, sh.y, b.x, b.y) < (10*S)**2){
									b.l = 0;
									kill();
									break
								}
							}
						}
						if(sh.alive && ufo && d2(sh.x, sh.y, ufo.x, ufo.y) < (ufo.r + 9*S)**2){
							killUfo();
							kill()
						}
					}
					bul = bul.filter(b => b.l > 0);
					ub = ub.filter(b => b.l > 0);
					ufoT -= dt;
					if(!ufo && ufoT <= 0 && rocks.length && sh.alive){
						spawnUfo();
					}
					if(ufo){
						const u = ufo;
						u.x += u.vx*dt;
						u.y = wr(u.y + u.vy*dt, H);
						u.ch -= dt;
						if(u.ch <= 0){
							u.ch = rnd(.8, 1.8);
							u.vy = [-1, 0, 1][R()*3|0]*70*S
						}
						u.fc -= dt;
						if(u.fc <= 0){
							u.fc = u.small ? 1.0 : 1.5;
							if(sh.alive){
								const ang = u.small ? Math.atan2(sh.y - u.y, sh.x - u.x) + rnd(-1, 1)*Math.max(.06, .55 - score/70000) : R()*TAU;
								ub.push({x: u.x, y: u.y, vx: Math.cos(ang)*280*S, vy: Math.sin(ang)*280*S, l: 1.8});
								tone(u.small ? 700 : 400, .15, 'square', .07, 200);
							}
						}
						u.sc -= dt;
						if(u.sc <= 0){
							u.sc = .16;
							u.ph ^= 1;
							tone(u.small ? (u.ph ? 1300 : 1050) : (u.ph ? 620 : 480), .14, 'sine', .06)
						}
						if(u.x < -45*S || u.x > W + 45*S){
							ufo = null;
							ufoT = rnd(12, 22)
						}
					}
					if(!rocks.length && !ufo && waveT < 0){
						waveT = 2;
					}
					if(waveT > 0){
						waveT -= dt;
						if(waveT <= 0){
							newWave();
							waveT = -1
						}
					}
					if(banner > 0){
						banner -= dt;
					}
					if(rocks.length && sh.alive){
						beatT -= dt;
						if(beatT <= 0){
							const w = [0, 1, 3, 7];
							let m = 0;
							for(const o of rocks){
								m += w[o.sz];
							}
							beatT = .3 + .7*Math.min(1, m/mass0);
							tone(beatI ? 92 : 110, .11, 'triangle', .3);
							beatI ^= 1;
						}
					}
				}

				let lw = 2;

				function path(pts, cl){
					g.beginPath();
					for(let i = 0; i < pts.length; i++){
						i ? g.lineTo(pts[i][0], pts[i][1]) : g.moveTo(pts[i][0], pts[i][1])
					}
					if(cl){
						g.closePath();
					}
					g.stroke();
				}

				function wd(x, y, r, fn){
					for(let i = -1; i < 2; i++){
						for(let j = -1; j < 2; j++){
							const X = x + i*W, Y = y + j*H;
							if(X > -r && X < W + r && Y > -r && Y < H + r){
								fn(X, Y);
							}
						}
					}
				}

				const SP = [[14, 0], [-10, -9], [-5, 0], [-10, 9]];

				function drawShip(x, y, a, sc, flame){
					g.save();
					g.translate(x, y);
					g.rotate(a);
					g.scale(sc, sc);
					g.lineWidth = lw/sc;
					path(SP, true);
					if(flame){
						path([[-6, -4], [-14 - R()*8, 0], [-6, 4]], false);
					}
					g.restore();
				}

				const UF = [[[-1, .1], [-.5, -.4], [.5, -.4], [1, .1], [.5, .6], [-.5, .6]], [[-1, .1], [1, .1]], [[-.4, -.4], [-.25, -.85], [.25, -.85], [.4, -.4]]];

				function txt(s, x, y, sz, al, a){
					g.globalAlpha = a == null ? 1 : a;
					g.font = Math.round(sz*S) + 'px "Courier New",Courier,monospace';
					g.textAlign = al || 'center';
					g.fillStyle = '#fff';
					g.fillText(s, x, y);
					g.globalAlpha = 1;
				}

				function draw(){
					g.setTransform(DPR, 0, 0, DPR, 0, 0);
					g.fillStyle = '#000';
					g.fillRect(0, 0, W, H);
					lw = Math.max(1.8, 2*S);
					g.strokeStyle = '#fff';
					g.fillStyle = '#fff';
					g.lineJoin = 'round';
					g.lineCap = 'round';
					g.shadowColor = '#bdf';
					g.shadowBlur = coarse ? 0 : 8;
					for(const o of rocks){
						wd(o.x, o.y, o.r, (X, Y) => {
							g.save();
							g.translate(X, Y);
							g.rotate(o.a);
							g.scale(o.r, o.r);
							g.lineWidth = lw/o.r;
							path(o.v, true);
							g.restore()
						});
					}
					if(ship.alive && (ship.inv <= 0 || ((tm*10)|0)%2 === 0)){
						const s = ship;
						wd(s.x, s.y, 20*S, (X, Y) => drawShip(X, Y, s.a, S, K.t && st === 'play' && !paused));
					}
					if(ufo){
						g.save();
						g.translate(ufo.x, ufo.y);
						g.scale(ufo.r, ufo.r);
						g.lineWidth = lw/ufo.r;
						path(UF[0], true);
						path(UF[1]);
						path(UF[2]);
						g.restore();
					}
					for(const b of bul){
						g.beginPath();
						g.arc(b.x, b.y, 1.8*S + .6, 0, TAU);
						g.fill()
					}
					for(const b of ub){
						g.beginPath();
						g.arc(b.x, b.y, 2*S + .6, 0, TAU);
						g.fill()
					}
					for(const p of parts){
						g.globalAlpha = Math.max(0, p.l/p.m);
						if (p.t === 'd'){
							g.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4)
						}else{
							const dx = Math.cos(p.a)*p.len/2, dy = Math.sin(p.a)*p.len/2;
							g.lineWidth = lw;
							g.beginPath();
							g.moveTo(p.x - dx, p.y - dy);
							g.lineTo(p.x + dx, p.y + dy);
							g.stroke();
						}
						g.globalAlpha = 1;
					}
					const m = 16;
					if(st !== 'title'){
						txt(String(score).padStart(5, '0'), m, m + 22*S, 26, 'left');
						for(let i = 0; i < lives && i < 12; i++){
							drawShip(m + 10*S + i*20*S, m + 50*S, -PI/2, .75*S, false);
						}
					}
					txt('REC ' + String(hi).padStart(5, '0'), W/2, m + 16*S, 16, 'center', .8);
					if(st === 'play' && banner > 0){
						txt('ONDATA ' + wave, W/2, H*.3, 34, 'center', Math.min(1, banner));
					}
					if(paused){
						txt('PAUSA', W/2, H/2, 48);
						txt(coarse ? 'tocca per riprendere' : 'premi P per riprendere', W/2, H/2 + 36*S, 18, 'center', .8);
					}
					if(st === 'title'){
						txt('ASTEROIDS', W/2, H*.34, Math.min(72, W/(S*7.2)));
						const bl = .55 + .45*Math.sin(tm*4);
						txt(coarse ? 'TOCCA PER INIZIARE' : 'PREMI INVIO O SPAZIO', W/2, H*.46, 22, 'center', bl);
						const L = coarse ? ['Pulsanti a schermo:', '&#9664; &#9654; ruota, &#9650; spinta, FUOCO', 'HYPER = iperspazio'] : ['Frecce / WASD: ruota e spinta', 'SPAZIO: fuoco	 SHIFT / &#8595;: iperspazio', 'P: pausa   M: audio'];
						L.forEach((s, i) => txt(s.replace(/&#(\d+);/g, (_, c) => String.fromCharCode(c)), W/2, H*.58 + i*26*S, 16, 'center', .7));
						txt('Vita extra ogni 10.000 punti', W/2, H*.58 + 90*S, 14, 'center', .55);
					}
					if(st === 'over'){
						txt('GAME OVER', W/2, H*.42, 52);
						txt('PUNTEGGIO ' + score, W/2, H*.42 + 40*S, 22, 'center', .9);
						if(overT <= 0){
							txt(coarse ? 'tocca per rigiocare' : 'premi INVIO o SPAZIO', W/2, H*.42 + 80*S, 18, 'center', .55 + .45*Math.sin(tm*4));
						}
					}
				}

				let last = 0;

				function loop(t){
					requestAnimationFrame(loop);
					const dt = Math.min(.033, (t - last)/1000||0);
					last = t;
					tm += dt;
					if(!paused){
						drift(dt);
						if(st === 'play'){
							play(dt);
						}
						if(overT > 0){
							overT -= dt
						}
					}
					if(AC && thG){
						thG.gain.setTargetAtTime(K.t && ship.alive && st === 'play' && !paused && !mute ? .3 : 0, AC.currentTime, .03);
					}
					draw();
				}

				function pause(v){
					if(st !== 'play'){
						return;
					}
					paused = v === undefined ? !paused : v;
					paB.style.opacity = paused ? .5 : 1
				}

				function toggleMute(){
					mute = !mute;
					muB.textContent = mute ? '\uD83D\uDD07' : '\uD83D\uDD0A';
					if(master){
						master.gain.value = mute ? 0 : .5
					}
				}

				function go(){
					if(st !== 'play' && overT <= 0){
						start();
					}else if(paused){
						pause(false)
					}
				}

				const km = {ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 't', KeyW: 't', Space: 'f', KeyZ: 'f', KeyX: 'f'};

				addEventListener('keydown', e => {
					const c = e.code;
					if(km[c] || c === 'ArrowDown' || c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyH' || c === 'Enter'){
						e.preventDefault();
					}
					ainit();
					if(km[c]){
						K[km[c]] = 1;
					}
					if((c === 'ArrowDown' || c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyH' || c === 'KeyS') && !e.repeat){
						hreq = true;
					}
					if((c === 'Enter' || c === 'Space') && !e.repeat){
						go();
					}
					if((c === 'KeyP') && !e.repeat){
						pause();
					}
					if(c === 'KeyM' && !e.repeat){
						toggleMute();
					}
				});

				addEventListener('keyup', e => {if(km[e.code]){K[km[e.code]] = 0}});

				addEventListener('blur', () => {K.l = K.r = K.t = K.f = 0; pause(true)});

				document.addEventListener('visibilitychange', () => {if(document.hidden){pause(true)}});

				cv.addEventListener('pointerdown', e => {ainit(); go()});

				function bind(id, key){
					const e = document.getElementById(id);
					e.addEventListener('pointerdown', ev => {
						ev.preventDefault();
						ainit();
						try{
							e.setPointerCapture(ev.pointerId)
						}catch(x){
						}
						if(key === 'h'){
							hreq = true;
						}else{
							K[key] = 1;
						}
						e.classList.add('on');
					});
					['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => e.addEventListener(n, () => {if(key !== 'h'){K[key] = 0;} e.classList.remove('on')}));
				}

				bind('bl', 'l');
				bind('br', 'r');
				bind('bt', 't');
				bind('bf', 'f');
				bind('bh', 'h');

				muB.addEventListener('pointerdown', e => {e.stopPropagation(); ainit(); toggleMute()});

				paB.addEventListener('pointerdown', e => {e.stopPropagation(); pause()});

				document.addEventListener('contextmenu', e => e.preventDefault());

				document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

				for(let i = 0; i < 7; i++){
					const a = R()*TAU, s = rnd(25, 60)*S;
					rocks.push(mkRock(1 + (R()*3|0), R()*W, R()*H, Math.cos(a)*s, Math.sin(a)*s))
				}

				requestAnimationFrame(loop);
			})();
		</script>
	</body>
</html>
