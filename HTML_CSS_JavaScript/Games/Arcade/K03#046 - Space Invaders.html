<!DOCTYPE html>
<html lang="it"><!--K03#046 - Rocco - Space Invaders-->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<title>Space Invaders</title>
		<style>
			:root{
				--g: #33ff33;
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px)
			}
			*{
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent
			}
			html,
			body{
				margin: 0;
				height: 100%;
				background: #000;
				color: #fff;
				font-family: "Courier New", monospace;
				overscroll-behavior: none
			}
			body{
				--w: min(calc(100vw - 16px), 460px, calc((100vh - 110px)*224/256));
				--w: min(calc(100vw - 16px), 460px, calc((100dvh - 110px)*224/256));
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 8px;
				padding: 8px;
				user-select: none;
				-webkit-user-select: none;
				touch-action: none
			}
			@media (hover:none) and (pointer:coarse){
				body{
					--w: min(calc(100vw - 16px), 460px, calc((100vh - 230px)*224/256));
					--w: min(calc(100vw - 16px), 460px, calc((100dvh - 230px)*224/256))
				}
			}
			.bar{
				display: flex;
				justify-content: flex-end;
				gap: 6px;
				width: var(--w)
			}
			.bar button{
				font: inherit;
				font-size: .85rem;
				color: #fff;
				background: #222;
				border: 1px solid #555;
				border-radius: 6px;
				padding: 3px 10px;
				cursor: pointer
			}
			.board{
				position: relative;
				width: var(--w);
				aspect-ratio: 224/256
			}
			canvas{
				display: block;
				width: 100%;
				height: 100%;
				background: #000;
				image-rendering: pixelated
			}
			.ov{
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 10px;
				background: rgba(0, 0, 0, .75);
				text-align: center;
				padding: 16px
			}
			.ov.hidden{
				display: none
			}
			.ov h1{
				margin: 0;
				color: var(--g);
				font-size: clamp(1.4rem, 6vw, 2.2rem);
				letter-spacing: 2px
			}
			.ov p{
				margin: 0;
				max-width: 30ch;
				line-height: 1.4
			}
			.play{
				font: inherit;
				font-weight: 700;
				font-size: 1.1rem;
				color: #000;
				background: var(--g);
				border: 0;
				border-radius: 999px;
				padding: 10px 28px;
				cursor: pointer
			}
			button:focus-visible{
				outline: 3px solid #fff;
				outline-offset: 2px
			}
			.ctl{
				display: none;
				width: var(--w);
				gap: 10px
			}
			.ctl button{
				flex: 1;
				height: 68px;
				font: inherit;
				font-size: 1.5rem;
				font-weight: 700;
				color: var(--g);
				background: #0d2b0d;
				border: 2px solid var(--g);
				border-radius: 14px
			}
			.ctl button.f{
				flex: 1.7;
				color: #000;
				background: var(--g);
				font-size: 1.1rem
			}
			.ctl button.on{
				filter: brightness(1.6)
			}
			@media (hover:none) and (pointer:coarse){
				.ctl{
					display: flex
				}
				.kbd{
					display: none
				}
			}
			.hint{
				margin: 0;
				font-size: .8rem;
				opacity: .7;
				text-align: center
			}
		</style>
	</head>
	<body>
		<div class="bar"><button id="snd">Suono: sì</button><button id="pa">Pausa</button></div>
		<div class="board">
			<canvas id="c"></canvas>
			<div class="ov" id="ov">
				<h1 id="ot">SPACE INVADERS</h1>
				<p id="om"></p><button class="play" id="pl">Gioca</button>
			</div>
		</div>
		<p class="hint kbd">Frecce o A D per muoverti · Spazio per sparare · P per la pausa</p>
		<div class="ctl">
			<button data-k="L" aria-label="Sinistra">◀</button><button data-k="R" aria-label="Destra">▶</button><button
				class="f" data-k="F">SPARA</button>
		</div>
		<script>
			(() => {
				const W = 224, H = 256, S = 3, PY = 220, SY = 192, GY = 232;
				const cv = document.getElementById('c'), ctx = cv.getContext('2d');
				cv.width = W*S;
				cv.height = H*S;
				ctx.imageSmoothingEnabled = false;
				const $ = id => document.getElementById(id);
				const rnd = (a, b) => a + Math.random()*(b - a);
				const P = s => s.split('/');

				function spr(rows, col){
					const c = document.createElement('canvas');
					c.width = rows[0].length;
					c.height = rows.length;
					const x = c.getContext('2d');
					x.fillStyle = col;
					rows.forEach((r, y) => [...r].forEach((ch, i) => {if(ch === 'X'){x.fillRect(i, y, 1, 1);}}));
					return c;
				}

				const SQ = [P('...XX.../..XXXX../.XXXXXX./XX.XX.XX/XXXXXXXX/..X..X../.X.XX.X./X.X..X.X'), P('...XX.../..XXXX../.XXXXXX./XX.XX.XX/XXXXXXXX/.X.XX.X./X......X/.X....X.')].map(r => spr(r, '#fff'));
				const CR = [P('..X.....X../...X...X.../..XXXXXXX../.XX.XXX.XX./XXXXXXXXXXX/X.XXXXXXX.X/X.X.....X.X/...XX.XX...'), P('..X.....X../X..X...X..X/X.XXXXXXX.X/XXX.XXX.XXX/XXXXXXXXXXX/.XXXXXXXXX./..X.....X../.X.......X.')].map(r => spr(r, '#fff'));
				const OC = [P('....XXXX..../.XXXXXXXXXX./XXXXXXXXXXXX/XXX..XX..XXX/XXXXXXXXXXXX/...XX..XX.../..XX.XX.XX../XX........XX'), P('....XXXX..../.XXXXXXXXXX./XXXXXXXXXXXX/XXX..XX..XXX/XXXXXXXXXXXX/..XXX..XXX../.XX..XX..XX./..XX....XX..')].map(r => spr(r, '#fff'));
				const CANROWS = P('......X....../.....XXX...../.....XXX...../.XXXXXXXXXXX./XXXXXXXXXXXXX/XXXXXXXXXXXXX/XXXXXXXXXXXXX/XXXXXXXXXXXXX');
				const CAN = spr(CANROWS, '#33ff33');
				const UFO = spr(P('.....XXXXXX...../...XXXXXXXXXX.../..XXXXXXXXXXXX../.XX.XX.XX.XX.XX./XXXXXXXXXXXXXXXX/..XXX..XX..XXX../...X........X...'), '#ff3b3b');
				const SHAPE = P('...XXXXX.../..XXXXXXX../.XXXXXXXXX./XXXXXXXXXXX/XXXXXXXXXXX/XXXXXXXXXXX/XXX.....XXX/XX.......XX');
				const SPR = [SQ, CR, CR, OC, OC], IW = [8, 11, 11, 12, 12], SC = [30, 20, 20, 10, 10];
				let ac = null, snd = true, nStep = 0;
				const NOTES = [110, 98, 87, 78];

				function beep(f, d, type = 'square', v = .05){
					if(!snd){
						return;
					}
					try{
						ac = ac || new (window.AudioContext || window.webkitAudioContext)();
						if(ac.state === 'suspended'){
							ac.resume();
						}
						const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
						o.type = type;
						o.frequency.value = f;
						g.gain.setValueAtTime(v, t);
						g.gain.exponentialRampToValueAtTime(.0001, t + d);
						o.connect(g);
						g.connect(ac.destination);
						o.start();
						o.stop(t + d);
					}catch(e){
					}
				}

				let state = 'title', paused = false, stT = 0, score = 0, best = 0, lives = 3, level = 1, nextLife = 1500;
				let inv, alive, ox, oy, dir, frame, acc, px, pb, eb, shields, ufo, ufoT, fireT, expl, pops, tt = 0;
				const keys = {L: false, R: false, F: false};
				const tap = {L: false, R: false};
				let hDir = 0, fireBuf = 0;

				function press(k){
					keys[k] = true;
					if(k === 'L'){
						tap.L = true;
						hDir = -1;
					}else if(k === 'R'){
						tap.R = true;
						hDir = 1;
					}else if(k === 'F'){
						fireBuf = .15;
					}
				}

				try{
					best = parseInt(localStorage.getItem('invaders-best')) || 0;
				}catch(e){
				}

				function newWave(){
					inv = [];
					for(let r = 0; r < 5; r++){
						for(let c = 0; c < 11; c++){
							inv.push({r, c, a: true});
						}
					}
					alive = 55;
					ox = 24;
					oy = 56 + 8*Math.min(level - 1, 7);
					dir = 1;
					frame = 0;
					acc = 0;
					eb = [];
					pb = null;
					ufo = null;
					ufoT = rnd(15, 25);
					fireT = 1;
					expl = [];
					pops = [];
					shields = [0, 1, 2, 3].map(i => ({x: 33 + i*45, g: SHAPE.map(r => [...r].map(ch => ch === 'X'))}));
				}

				function newGame(){
					score = 0;
					lives = 3;
					level = 1;
					nextLife = 1500;
					px = W/2;
					newWave();
					state = 'play';
					paused = false;
					$('pa').textContent = 'Pausa';
					hide();
				}

				function erode(s, ci, ri){
					for(let dr = -1; dr <= 1; dr++){
						for (let dc = -1; dc <= 1; dc++) {
							const r = ri + dr, c = ci + dc;
							if(r >= 0 && r < 8 && c >= 0 && c < 11 && ((!dr && !dc) || Math.random() < .55)){
								s.g[r][c] = false;
							}
						}
					}
				}

				function shieldHit(x, y){
					for(const s of shields){
						if(x >= s.x && x < s.x + 22 && y >= SY && y < SY + 16){
							const ci = (x - s.x) >> 1, ri = (y - SY) >> 1;
							if(s.g[ri][ci]){
								erode(s, ci, ri);
								return true;
							}
						}
					}
					return false;
				}

				function eatShields(){
					for(const v of inv){
						if(!v.a){
							continue;
						}
						const w = IW[v.r], l = ox + v.c*16 + 8 - w/2, t = oy + v.r*16;
						for(const s of shields){
							const c0 = Math.max(0, Math.floor((l - s.x)/2)), c1 = Math.min(10, Math.floor((l + w - 1 - s.x)/2));
							const r0 = Math.max(0, Math.floor((t - SY)/2)), r1 = Math.min(7, Math.floor((t + 7 - SY)/2));
							for(let r = r0; r <= r1; r++){
								for(let c = c0; c <= c1; c++){
									s.g[r][c] = false;
								}
							}
						}
					}
				}

				function die(){
					state = 'dying';
					stT = 0;
					lives--;
					eb = [];
					pb = null;
					beep(60, .7, 'sawtooth', .1);
				}

				function over(){
					state = 'over';
					const rec = score > best;
					if(rec){
						best = score;
						try{
							localStorage.setItem('invaders-best', best);
						}catch(e){
						}
					}
					show('GAME OVER', 'Punteggio: ' + score + (rec ? ' — nuovo record!' : ''), 'Rigioca');
				}

				function addScore(v){
					score += v;
					if(score >= nextLife){
						lives++;
						nextLife += 1500;
						beep(660, .2);
					}
				}

				function step(){
					let mn = 99, mx = -1, mr = -1;
					for(const v of inv){
						if(v.a){
							mn = Math.min(mn, v.c);
							mx = Math.max(mx, v.c);
							mr = Math.max(mr, v.r);
						}
					}
					const L = ox + mn*16 + 2, R = ox + mx*16 + 14;
					if((dir > 0 && R + 2 > W - 6)||(dir < 0 && L - 2 < 6)){
						oy += 8;
						dir = -dir;
					}else{
						ox += 2*dir;
					}
					frame ^= 1;
					beep(NOTES[nStep++ & 3], .07);
					const bot = oy + mr*16 + 8;
					if(bot >= SY){
						eatShields();
					}
					if(bot >= PY){
						lives = 1;
						die();
					}
				}

				function movePlayerBullet(dt){
					let d = 240*dt;
					while(d > 0 && pb){
						const s = Math.min(1, d);
						pb.y -= s;
						d -= s;
						if(pb.y < 22){
							pb = null;
							break;
						}
						if(shieldHit(pb.x, pb.y)){
							pb = null;
							break;
						}
						if(ufo && pb.x >= ufo.x && pb.x <= ufo.x + 16 && pb.y <= 39 && pb.y >= 32){
							addScore(ufo.pts);
							pops.push({x: ufo.x + 8, y: 36, v: ufo.pts, t: 1});
							beep(300, .3, 'triangle', .08);
							ufo = null;
							pb = null;
							break;
						}
						for(const v of inv){
							if(!v.a){
								continue;
							}
							const w = IW[v.r], l = ox + v.c*16 + 8 - w/2, t = oy + v.r*16;
							if(pb.x >= l && pb.x <= l + w && pb.y >= t && pb.y <= t + 8){
								v.a = false;
								alive--;
								addScore(SC[v.r]);
								expl.push({x: l + w / 2, y: t + 4, t: .2});
								beep(200, .09, 'sawtooth');
								pb = null; break;
							}
						}
					}
				}

				function update(dt){
					tt += dt;
					if(state !== 'play'){
						tap.L = tap.R = false;
						fireBuf = 0;
					}
					pops = pops.filter(p => (p.t -= dt) > 0);
					expl = expl.filter(e => (e.t -= dt) > 0);
					if(state === 'dying'){
						if((stT += dt) >= 1.6){
							if(lives <= 0){
								over();
							}else{
								state = 'play';
								px = W/2;
							}
						}
						return;
					}
					if(state === 'clear'){
						if((stT += dt) >= 1.3){
							level++;
							newWave();
							state = 'play';
						}
						return;
					}
					if(state !== 'play'){
						return;
					}
					const gl = keys.L || tap.L, gr = keys.R || tap.R;
					const mv = (gl && gr) ? hDir : (gr ? 1 : (gl ? -1 : 0));
					tap.L = tap.R = false;
					px = Math.max(10, Math.min(W - 10, px + mv*90*dt));
					fireBuf = Math.max(0, fireBuf - dt);
					if((keys.F || fireBuf > 0) && !pb){
						fireBuf = 0;
						pb = {x: px, y: PY - 1};
						beep(880, .07);
					}
					if(pb){
						movePlayerBullet(dt);
					}
					acc += dt;
					const iv = (.04 + .4*alive/55)*Math.pow(.92, level - 1);
					while(acc >= iv && state === 'play' && alive > 0){
						acc -= iv;
						step();
					}
					if(state !== 'play'){
						return;
					}
					if((fireT -= dt) <= 0 && eb.length < 3 + (level > 3 ? 1 : 0) && alive > 0){
						fireT = rnd(.5, 1.3)*Math.max(.4, 1 - .08*(level - 1));
						const cols = [...new Set(inv.filter(v => v.a).map(v => v.c))];
						let c = cols[Math.random()*cols.length|0];
						if(Math.random() < .3){
							c = cols.reduce((a, b) => Math.abs(ox + b*16 + 8 - px) < Math.abs(ox + a*16 + 8 - px) ? b : a);
						}
						let low = null;
						for(const v of inv){
							if (v.a && v.c === c && (!low || v.r > low.r)){
								low = v;
							}
						}
						eb.push({x: ox + c*16 + 8, y: oy + low.r*16 + 8});
					}
					const sp = Math.min(150, 95 + 8*level);
					eb = eb.filter(b => {
						let d = sp*dt;
						while(d > 0){
							const s = Math.min(1, d);
							b.y += s;
							d -= s;
							if(shieldHit(b.x, b.y) || b.y >= GY){
								return false;
							}
							if(b.x >= px - 6.5 && b.x <= px + 6.5 && b.y >= PY && b.y <= PY + 8){
								die();
								return false;
							}
						}
						return true;
					});
					if(state !== 'play'){
						return;
					}
					if(ufo){
						ufo.x += ufo.dir*45*dt;
						if(ufo.x < -18 || ufo.x > W + 2){
							ufo = null;
						}
					}else if((ufoT -= dt) <= 0 && alive > 8){
						const dr = Math.random() < .5 ? 1 : -1;
						ufo = {x: dr > 0 ? -16 : W, dir: dr, pts: [50, 100, 150, 300][Math.random()*4 | 0]};
						ufoT = rnd(20, 30);
					}
					if(ufo&&((tt*6) | 0)%2 === 0 && ((tt*6 - dt*6) | 0) !== ((tt*6) | 0)){
						beep(500, .06, 'triangle', .03);
					}
					if(alive === 0){
						state = 'clear';
						stT = 0;
					}
				}

				function text(s, x, y, col, al){
					ctx.fillStyle = col;
					ctx.textAlign = al || 'left';
					ctx.fillText(s, x, y);
				}

				function render(){
					ctx.setTransform(S, 0, 0, S, 0, 0);
					ctx.fillStyle = '#000';
					ctx.fillRect(0, 0, W, H);
					ctx.font = '8px "Courier New",monospace';
					text('PUNTI ' + String(score).padStart(4, '0'), 8, 10, '#fff');
					text('RECORD ' + String(Math.max(best, score)).padStart(4, '0'), W - 8, 10, '#fff', 'right');
					text('LIV ' + level, W/2, 10, '#fff', 'center');
					for(const v of inv){
						if(v.a){
							const w = IW[v.r];
							ctx.drawImage(SPR[v.r][frame], Math.round(ox + v.c*16 + 8 - w/2), Math.round(oy + v.r*16));
						}
					}
					if(ufo){
						ctx.drawImage(UFO, Math.round(ufo.x), 32);
					}
					ctx.fillStyle = '#33ff33';
					for(const s of shields){
						s.g.forEach((row, r) => row.forEach((on, c) => {
								if(on){
									ctx.fillRect(s.x + c * 2, SY + r * 2, 2, 2);
								}
							})
						);
					}
					if(state === 'dying'){
						const seed = (stT*10)|0;
						CANROWS.forEach((row, y) => [...row].forEach((ch, x) => {
							if(ch === 'X' && ((Math.sin((x + y*13)*12.9898 + seed*78.233)*43758.5453)%1 + 1)%1 > .45){
								ctx.fillRect(Math.round(px - 6.5) + x, PY + y, 1, 1);
							}
						}));
					}else if(state !== 'over' && state !== 'title'){
						ctx.drawImage(CAN, Math.round(px - 6.5), PY);
					}
					ctx.fillStyle = '#fff';
					if(pb){
						ctx.fillRect(Math.round(pb.x), Math.round(pb.y) - 3, 1, 4);
					}
					for(const b of eb){
						ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 3, 1, 2);
						ctx.fillRect(Math.round(b.x), Math.round(b.y) - 1, 1, 2);
						ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) + 1, 1, 2);
					}
					for(const e of expl){
						for(let i = 0; i < 8; i++){
							const a = i*Math.PI/4;
							for(const r of [3, 5]){
								ctx.fillRect(Math.round(e.x + Math.cos(a)*r), Math.round(e.y + Math.sin(a)*r), 1, 1);
							}
						}
					}
					ctx.fillStyle = '#33ff33';
					ctx.fillRect(0, GY, W, 1);
					for(let i = 0; i < Math.max(0, lives - (state === 'play' || state === 'clear' ? 1 : 0)); i++){
						ctx.drawImage(CAN, 8 + i*16, 242);
					}
					text(String(Math.max(0, lives)), W - 8, 250, '#33ff33', 'right');
					for(const p of pops){
						text(String(p.v), p.x, p.y + 3, '#ff3b3b', 'center');
					}
				}

				const ov = $('ov');

				function show(t, m, b){
					$('ot').textContent = t;
					$('om').textContent = m;
					$('pl').textContent = b;
					ov.classList.remove('hidden');
				}

				function hide(){
					ov.classList.add('hidden');
				}

				function setPause(p){
					if(state === 'title' || state === 'over'){
						return;
					}
					paused = p;
					$('pa').textContent = p ? 'Riprendi' : 'Pausa';
					if(p){
						show('PAUSA', 'Il gioco è fermo.', 'Riprendi');
					}else{
						hide();
					}
				}

				function go(){
					if(paused){
						setPause(false);
					}else if(state === 'title' || state === 'over'){
						newGame();
					}
				}

				show('SPACE INVADERS', 'Fermali prima che arrivino a terra. Ripararti dietro agli scudi e colpisci il disco rosso per i punti bonus.', 'Gioca');
				newWave();
				px = W/2;

				$('pl').addEventListener('click', go);

				$('pa').addEventListener('click', () => setPause(!paused));

				$('snd').addEventListener('click', () => {snd = !snd; $('snd').textContent = 'Suono: ' + (snd ? 'sì' : 'no');});

				document.addEventListener('visibilitychange', () => {if(document.hidden){setPause(true);}});

				const KM = {ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ' ': 'F', ArrowUp: 'F'};

				window.addEventListener('keydown', e => {
					if(e.key in KM){
						e.preventDefault();
						if(state === 'title' || state === 'over'){
							newGame();
						}
						if(e.repeat){
							keys[KM[e.key]] = true;
						}else{
							press(KM[e.key]);
						}
					}else if(e.key === 'p' || e.key === 'P'){
						setPause(!paused);
					}else if(e.key === 'Enter'){
						go();
					}
				});

				window.addEventListener('keyup', e => {if (e.key in KM) keys[KM[e.key]] = false;});

				window.addEventListener('blur', () => {keys.L = keys.R = keys.F = false;});

				document.querySelectorAll('.ctl button').forEach(b => {
					const k = b.dataset.k, on = e => {
						e.preventDefault();
						try{
							b.setPointerCapture(e.pointerId);
						}catch(x){
						}
						press(k);
						b.classList.add('on');
					};
					const off = () => {
						keys[k] = false;
						b.classList.remove('on');
					};
					b.addEventListener('pointerdown', on);
					['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
					b.addEventListener('contextmenu', e => e.preventDefault());
				});

				let last = 0;

				function frameLoop(ts) {
					requestAnimationFrame(frameLoop);
					const dt = Math.min(.05, (ts - last)/1000||0);
					last = ts;
					if(!paused && state !== 'title' && state !== 'over'){
						update(dt);
					}
					render();
				}
				requestAnimationFrame(frameLoop);
			})();
		</script>
	</body>
</html>
