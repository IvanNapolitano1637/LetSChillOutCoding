<!DOCTYPE html>
<html lang="it"><!--M04#058 - Alberto - Sudoku-->
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
		<title>Sudoku</title>
		<style>
			:root{
				--n: 9;
				--b: 3;
				--pc: 9;
				--ph: 1.2;
				--nfs: calc(var(--s)*.24);
				--mx: 520px;
				--ofs: 310px;
				--w: max(290px, min(96vw, var(--mx), calc(100vh - var(--ofs))));
				--s: calc(var(--w)/var(--n));
			}
			*{
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html, body{
				margin: 0;
				background: radial-gradient(circle at 30% 0, #2b3558, #141826 70%) fixed;
				color: #eef;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				user-select: none;
				-webkit-user-select: none;
				touch-action: manipulation;
			}
			body{
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
				padding: 10px 0 22px;
				min-height: 100vh;
			}
			h1{
				margin: 0;
				font-size: 22px;
				letter-spacing: 3px;
				font-weight: 800;
				color: #cfe0ff;
				text-shadow: 0 2px 8px rgba(0, 0, 0, .5);
			}
			#top{
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				align-items: center;
				justify-content: space-between;
				width: var(--w);
			}
			select, button{
				font-size: 14px;
				font-weight: 600;
				font-family: inherit;
				border: 0;
				border-radius: 10px;
				padding: 10px 12px;
				background: #35406a;
				color: #fff;
				box-shadow: 0 2px 0 #1b2240;
				cursor: pointer;
			}
			button:active{
				transform: translateY(2px);
				box-shadow: none;
			}
			button.on{
				background: #e8a317;
				color: #222;
			}
			#top button{
				padding: 10px 9px;
				font-size: 13px;
			}
			#tm{
				font-variant-numeric: tabular-nums;
				font-size: 18px;
				font-weight: 700;
				color: #cfe0ff;
				min-width: 56px;
				text-align: right;
			}
			.dd{
				position: relative;
			}
			.dd > button::after{
				content: "\25BE";
				margin-left: 6px;
				font-size: 12px;
			}
			.dm{
				display: none;
				position: absolute;
				left: 0;
				top: calc(100% + 4px);
				min-width: 100%;
				z-index: 50;
				background: #35406a;
				border-radius: 10px;
				overflow: hidden;
				box-shadow: 0 8px 24px rgba(0, 0, 0, .6);
			}
			.dm.open{
				display: block;
			}
			.dm div{
				padding: 11px 14px;
				font-size: 14px;
				font-weight: 600;
				white-space: nowrap;
				cursor: pointer;
			}
			.dm div:hover{
				background: #46549b;
			}
			.dm div.cur{
				background: #e8a317;
				color: #222;
			}
			#bd{
				display: grid;
				grid-template-columns: repeat(var(--n), minmax(0, 1fr));
				grid-template-rows: repeat(var(--n), minmax(0, 1fr));
				width: var(--w);
				height: var(--w);
				border: 3px solid #1d2748;
				border-radius: 10px;
				overflow: hidden;
				background: #fff;
				box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
			}
			.cell{
				position: relative;
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				background: var(--cc, #fff);
				border: 1px solid #c5cde0;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.cell.r3{
				border-right: 2px solid #1d2748;
			}
			.cell.b3{
				border-bottom: 2px solid #1d2748;
			}
			.cell::after{
				content: "";
				position: absolute;
				inset: 0;
				pointer-events: none;
			}
			.cell.peer::after{
				background: rgba(60, 110, 200, .13);
			}
			.cell.same::after{
				background: rgba(60, 110, 200, .30);
			}
			.cell.sel::after{
				background: rgba(60, 110, 200, .50);
			}
			.cell.wr::after{
				background: rgba(220, 38, 38, .4);
			}
			.v{
				position: relative;
				z-index: 1;
				line-height: 1;
				font-size: calc(var(--s)*.6);
				font-weight: 600;
				color: #2563eb;
			}
			.cell.err .v{
				color: #dc2626;
			}
			.nt{
				position: absolute;
				inset: 0;
				display: grid;
				grid-template-columns: repeat(var(--b), minmax(0, 1fr));
				grid-template-rows: repeat(var(--b), minmax(0, 1fr));
				font-size: var(--nfs);
				white-space: nowrap;
				color: #556;
				z-index: 1;
				line-height: 1;
			}
			.nt span{
				display: flex;
				align-items: center;
				justify-content: center;
			}
			#pad{
				display: grid;
				grid-template-columns: repeat(var(--pc), minmax(0, 1fr));
				gap: 4px;
				width: var(--w);
			}
			#pad button{
				position: relative;
				padding: 0;
				height: calc(var(--w)/var(--pc)*var(--ph));
				font-size: calc(var(--w)/var(--pc)*.5);
				border-radius: 8px;
				background: #46549b;
			}
			#pad button small{
				position: absolute;
				right: 3px;
				bottom: 1px;
				font-size: calc(var(--w)/var(--pc)*.2);
				opacity: .75;
				font-weight: 500;
			}
			#pad button:disabled{
				opacity: .25;
			}
			#tools{
				display: grid;
				grid-template-columns: repeat(5, minmax(0, 1fr));
				gap: 4px;
				width: var(--w);
			}
			#tools button{
				padding: 10px 0;
				font-size: clamp(11px, calc(var(--w)*.034), 13px);
				white-space: nowrap;
				overflow: hidden;
			}
			#msg{
				min-height: 24px;
				font-size: 16px;
				font-weight: 600;
				color: #ffd479;
				text-align: center;
				width: var(--w);
			}
			.cell.giv .v{
				font-weight: 800;
				color: #141b3a;
			}
		</style>
	</head>
	<body>
		<h1>SUDOKU</h1>
		<div id="top">
			<div class="dd">
				<button id="lv" type="button" data-v="2">Medio</button>
				<div class="dm">
					<div data-v="1">Facile</div>
					<div data-v="2">Medio</div>
					<div data-v="3">Difficile</div>
				</div>
			</div>
			<div class="dd">
				<button id="sz" type="button" data-v="9">9×9</button>
				<div class="dm">
					<div data-v="9">9×9</div>
					<div data-v="16">16×16</div>
				</div>
			</div>
			<button id="nw">Nuova partita</button>
			<span id="tm">00:00</span>
		</div>
		<div id="bd"></div>
		<div id="pad"></div>
		<div id="tools"><button id="nt">Note: NO</button><button id="un">Annulla</button><button id="er">Cancella</button><button id="hn">Aiuto</button><button id="ck">Verifica</button></div>
		<div id="msg"></div>
		<script>
			const $ = id => document.getElementById(id), CLUES = {9: [40, 32, 26], 16: [160, 130, 105]};
			let N = 9, BS = 3, NN = 81, ALL = 1022, NL = 4e5, RW = [], CL = [], BXA = [];
			const sym = v => N === 9 ? v : String.fromCharCode(64 + v);

			function geo(n){
				N = n;
				BS = n === 9 ? 3 : 4;
				NN = n*n;
				ALL = (1 << (n + 1)) - 2;
				NL = n === 9 ? 4e5 : 3000;
				RW = [];
				CL = [];
				BXA = [];
				for(let i = 0; i < NN; i++){
					RW.push(i/N|0);
					CL.push(i%N);
					BXA.push(((i/N|0)/BS|0)*BS + ((i%N)/BS|0));
				}
				const st = document.documentElement.style;
				document.querySelector('meta[name=viewport]').content = n === 9 ? 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no' : 'width=device-width,initial-scale=1';
				st.setProperty('--n', N);
				st.setProperty('--b', BS);
				st.setProperty('--pc', n === 9 ? 9 : 8);
				st.setProperty('--ph', n === 9 ? 1.2 : .95);
				st.setProperty('--nfs', n === 9 ? 'calc(var(--s)*.24)' : 'calc((var(--s) - 5px)/4*.92)');
				st.setProperty('--mx', n === 9 ? '520px' : '900px');
				st.setProperty('--ofs', n === 9 ? '310px' : '375px');
			}
			geo(9);

			const pc = m => {
				let n = 0;
				while(m){
					m &= m - 1;
					n++;
				}
				return n;
			};

			function solve(limit, rand, init){
				const g = Array(NN).fill(0), R = Array(N).fill(0), C = Array(N).fill(0), B = Array(N).fill(0);
				let cnt = 0, nodes = 0, sol = null;
				function put(i, v){
					g[i] = v;
					R[RW[i]] ^= 1 << v;
					C[CL[i]] ^= 1 << v;
					B[BXA[i]] ^= 1 << v;
				}
				function out(i, v){
					g[i] = 0;
					R[RW[i]] ^= 1 << v;
					C[CL[i]] ^= 1 << v;
					B[BXA[i]] ^= 1 << v;
				}
				function rec(){
					if(cnt >= limit || nodes > NL){
						return;
					}
					nodes++;
					let bi = -1, bm = 0, bc = N + 1;
					for(let i = 0; i < NN; i++){
						if(!g[i]){
							const m = ALL & ~(R[RW[i]]|C[CL[i]]|B[BXA[i]]), c = pc(m);
							if(c < bc){
								bc = c;
								bi = i;
								bm = m;
								if(c < 2){
									break;
								}
							}
						}
					}
					if(bi < 0){
						cnt++;
						if(!sol){
							sol = g.slice();
						}
						return;
					}
					if(!bc){
						return;
					}
					const vs = [];
					for(let v = 1; v <= N; v++){
						if(bm >> v & 1){
							vs.push(v);
						}
					}
					if(rand){
						vs.sort(() => Math.random() - .5);
					}
					for(const v of vs){
						put(bi, v);
						rec();
						out(bi, v);
						if(cnt >= limit || nodes > NL){
							return;
						}
					}
				}
				if(init){
					for(let i = 0; i < NN; i++){
						if (init[i]){
							put(i, init[i]);
						}
					}
				}
				rec();
				return {cnt, sol, to: nodes > NL};
			}

			function patternGrid(){
				const shuf = a => a.sort(() => Math.random() - .5);
				const sh = () => {
					const o = [];
					for(const a of shuf([...Array(BS).keys()])){
						for(const b of shuf([...Array(BS).keys()])){
							o.push(a*BS + b);
						}
					}
					return o;
				};
				const rows = sh(), cols = sh(), dg = shuf([...Array(N).keys()].map(x => x + 1)), f = [];
				for(let r = 0; r < N; r++){
					for(let c = 0; c < N; c++){
						f.push(dg[(BS*(rows[r]%BS) + (rows[r]/BS|0) + cols[c])%N]);
					}
				}
				return f;
			}

			function gen(target){
				const T = Date.now(), full = N === 9 ? solve(1, true).sol : patternGrid(), p = full.slice(), ord = [...Array(NN).keys()].sort(() => Math.random() - .5);
				let left = NN;
				for(const i of ord){
					if(left <= target || (N > 9 && Date.now() - T > 5000)){
						break;
					}
					const s = p[i];
					p[i] = 0;
					const r = solve(2, false, p);
					if(r.cnt === 1 && !r.to){
						left--;
					}else{
						p[i] = s;
					}
				}
				return {full, p};
			}

			function peers(i, j){
				return i !== j && (RW[i] === RW[j] || CL[i] === CL[j] || BXA[i] === BXA[j]);
			}

			let sol, giv, val, nts, sel = -1, noteMode = false, hist = [], t0, timer, done = false, gt;
			const bd = $('bd'), cells = [];

			function build(){
				bd.innerHTML = '';
				$('pad').innerHTML = '';
				cells.length = 0;
				for(let i = 0; i < NN; i++){
					const d = document.createElement('div');
					d.className = 'cell';
					d.innerHTML = '<div class="v"></div>';
					d.onpointerdown = () => {sel = i; render();};
					bd.appendChild(d);
					cells.push(d);
				}
				for(let n = 1; n <= N; n++){
					const b = document.createElement('button');
					b.id = 'p' + n;
					b.innerHTML = sym(n) + '<small></small>';
					b.onclick = () => setNum(n);
					$('pad').appendChild(b);
				}
			}
			build();

			function newGame(){
				$('msg').textContent = 'Generazione...';
				clearInterval(timer);
				clearTimeout(gt);
				gt = setTimeout(() => {
					const z = +$('sz').dataset.v;
					if(z !== N){
						geo(z);
						build();
					}
					const r = gen(CLUES[N][+$('lv').dataset.v - 1]);
					sol = r.full;
					giv = r.p.map(x => !!x);
					val = r.p.slice();
					nts = Array(NN).fill(0);
					hist = [];
					sel = -1;
					done = false;
					$('msg').textContent = '';
					$('tm').textContent = '00:00';
					t0 = Date.now();
					timer = setInterval(() => {const s = (Date.now() - t0)/1000|0; $('tm').textContent = String(s/60|0).padStart(2, '0') + ':' + String(s%60).padStart(2, '0')}, 1000);
					render();
				}, 30)
			}

			function push(){
				hist.push([val.slice(), nts.slice()]);
				if(hist.length > 200){
					hist.shift();
				}
			}

			function setNum(n){
				if(sel < 0 || giv[sel] || done){
					return;
				}
				push();
				if(noteMode && !val[sel]){
					nts[sel] ^= 1 << n;
				}else{
					if(val[sel] === n){
						val[sel] = 0;
					}else{
						val[sel] = n;
						nts[sel] = 0;
						for(let j = 0; j < NN; j++){
							if(peers(sel, j)){
								nts[j] &= ~(1 << n);
							}
						}
					}
				}
				render();
				check();
			}

			function check(){
				if(val.every((v, i) => v === sol[i])){
					done = true;
					clearInterval(timer);
					$('msg').textContent = 'Complimenti, hai risolto il Sudoku!';
				}
			}

			function render(){
				const sv = sel >= 0 ? val[sel] : 0, cnt = Array(N + 1).fill(0);
				for(let i = 0; i < NN; i++){
					const d = cells[i], v = val[i];
					let c = 'cell' + (CL[i]%BS === BS - 1 && CL[i] < N - 1 ? ' r3' : '') + (RW[i]%BS === BS - 1 && RW[i] < N - 1 ? ' b3' : '') + (giv[i] ? ' giv' : '');
					if(v){
						cnt[v]++;
					}
					if(i === sel){
						c += ' sel';
					}else if(sel >= 0 && peers(sel, i)){
						c += ' peer';
					}
					if(sv && v === sv && i !== sel){
						c += ' same';
					}
					if(v){
						for(let j = 0; j < NN; j++){
							if(peers(i, j) && val[j] === v){
								c += ' err';
								break;
							}
						}
					}
					d.className = c;
					const e = d.firstChild;
					if(v){
						e.className = 'v';
						e.textContent = sym(v);
					}else if(nts[i]){
						e.className = 'nt';
						let h = '';
						for(let n = 1; n <= N; n++){
							h += '<span>' + (nts[i] >> n & 1 ? sym(n) : '') + '</span>';
						}
						e.innerHTML = h;
					}else{
						e.className = 'v';
						e.textContent = '';
					}
				}
				for(let n = 1; n <= N; n++){
					const b = $('p' + n);
					b.disabled = cnt[n] >= N;
					b.lastChild.textContent = N - cnt[n];
				}
			}

			const closeDD = () => document.querySelectorAll('.dm').forEach(m => m.classList.remove('open'));
			function dd(id, fn){
				const b = $(id), m = b.nextElementSibling;
				const mark = () => {
					for(const o of m.children){
						o.className = o.dataset.v === b.dataset.v ? 'cur' : '';
					}
				};
				mark();
				b.onclick = e => {
					e.stopPropagation();
					const op = m.classList.contains('open');
					closeDD();
					if(!op){
						m.classList.add('open');
					}
				};
				for(const o of m.children){
					o.onclick = e => {
						e.stopPropagation();
						closeDD();
						if(o.dataset.v !== b.dataset.v){
							b.dataset.v = o.dataset.v;
							b.textContent = o.textContent;
							mark();
							fn();
						}
					};
				}
			}
			dd('lv', newGame);
			dd('sz', newGame);
			document.addEventListener('pointerdown', e => {
				if(!e.target.closest('.dd')){
					closeDD();
				}
			});

			$('nw').onclick = newGame;
			$('nt').onclick = () => {
				noteMode = !noteMode;
				$('nt').textContent = 'Note: ' + (noteMode ? 'SI' : 'NO');
				$('nt').className = noteMode ? 'on' : ''
			};
			$('un').onclick = () => {
				if(hist.length && !done){
					[val, nts] = hist.pop();
					render()
				}
			};
			$('er').onclick = () => {
				if(sel >= 0 && !giv[sel] && !done){
					push();
					val[sel] = 0;
					nts[sel] = 0;
					render();
				}
			};
			$('hn').onclick = () => {
				if(done){
					return;
				}
				let i = sel;
				if(i < 0 || giv[i] || val[i] === sol[i]){
					const e = [];
					for(let k = 0; k < NN; k++){
						if (val[k] !== sol[k]){
							e.push(k);
						}
					}
					if(!e.length){
						return;
					}
					i = e[Math.random()*e.length|0];
				}
				push();
				sel = i;
				val[i] = sol[i];
				nts[i] = 0;
				for(let j = 0; j < NN; j++){
					if(peers(i, j)){
						nts[j] &= ~(1 << sol[i]);
					}
				}
				render();
				check();
			};
			$('ck').onclick = () => {
				if(done){
					return;
				}
				let n = 0;
				for(let i = 0; i < NN; i++){
					if(val[i] && val[i] !== sol[i]){
						n++;
						cells[i].classList.add('wr');
					}
				}
				$('msg').textContent = n ? n + (n > 1 ? ' numeri sbagliati' : ' numero sbagliato') : 'Nessun errore finora!';
				setTimeout(() => {$('msg').textContent = done ? $('msg').textContent : ''; render()}, 1800);
			};
			addEventListener('keydown', e => {
				const k = e.key.toLowerCase();
				if(N === 9 && e.key >= '1' && e.key <= '9'){
					setNum(+e.key);
				}else if(N === 16 && !e.ctrlKey && !e.metaKey && k.length === 1 && k >= 'a' && k <= 'p'){
					setNum(k.charCodeAt(0) - 96);
				}else if(e.key === 'Backspace' || e.key === 'Delete' || e.key === '0'){
					$('er').click();
				}else if((N === 9 && k === 'n') || (N === 16 && e.key === '.')){
					$('nt').click();
				}else if((e.ctrlKey || e.metaKey) && k === 'z'){
					e.preventDefault();
					$('un').click();
				}else if(e.key.startsWith('Arrow')){
					e.preventDefault();
					if(sel < 0){
						sel = (N >> 1)*N + (N >> 1);
					}else{
						const r = sel/N|0, c = sel%N;
						sel = e.key === 'ArrowUp' ? ((r + N - 1)%N)*N + c : e.key === 'ArrowDown' ? ((r + 1)%N)*N + c : e.key === 'ArrowLeft' ? r*N + (c + N - 1)%N : r*N + (c + 1)%N;
					}
					render();
				}
			});

			newGame();
		</script>
	</body>
</html>
