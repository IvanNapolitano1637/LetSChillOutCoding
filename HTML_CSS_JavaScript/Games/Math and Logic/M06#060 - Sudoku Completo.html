.2 : .95);\n\t\t\t\tst.setProperty('--vf', n === 9 ? .6 : .5);\n\t\t\t\tst.setProperty('--nfs', n === 9 ? 'calc(var(--s)*.27)' : 'calc((var(--s) - 5px)/4*.88)');\n\t\t\t\tst.setProperty('--nls', n === 9 ? 'calc(var(--s)*.2)' : 'calc((var(--s) - 5px - (var(--lfs)*1.05 + 2px))/4*.88)');\n\t\t\t\tst.setProperty('--np', n === 9 ? 'calc(var(--s)*.06) calc(var(--s)*.04)' : '1px');\n\t\t\t\tst.setProperty('--ls', n === 9 ? '0em' : '-.07em');\n\t\t\t\tst.setProperty('--w', n === 9 ? 'max(290px, min(96vw, 520px, calc(100vh - 310px)))' : 'max(290px, min(96vw, var(--bw)))');\n\t\t\t\tst.setProperty('--bw', n === 9 ? 'var(--w)' : 'max(' + (innerWidth <= 700 ? 840 : 600) + 'px, min(96vw, 900px, calc(100vh - 340px)))');\n\t\t\t\tst.setProperty('--wh', n === 9 ? 'var(--w)' : 'min(var(--bw), max(var(--w), calc(100vh - 340px)))');\n\t\t\t\tst.setProperty('--lfs', n === 9 ? 'max(11px, calc(var(--s)*.3))' : 'calc(var(--s)*.2)');\n\t\t\t\tst.setProperty('--cgd', n === 9 ? 'block' : 'none');\n\t\t\t}\n\t\t\tgeo(9);\n\n\t\t\tconst pc = m => {\n\t\t\t\tlet n = 0;\n\t\t\t\twhile(m){\n\t\t\t\t\tm &= m - 1;\n\t\t\t\t\tn++;\n\t\t\t\t}\n\t\t\t\treturn n;\n\t\t\t};\n\n\t\t\tfunction solve(co, cg, limit, rand, init){\n\t\t\t\tconst g = Array(NN).fill(0), R = Array(N).fill(0), C = Array(N).fill(0), B = Array(N).fill(0);\n\t\t\t\tconst cs = cg ? cg.map(() => 0) : 0, cn = cg ? cg.map(() => 0) : 0, cm = cg ? cg.map(() => 0) : 0;\n\t\t\t\tlet cnt = 0, nodes = 0, sol = null, sol2 = null;\n\t\t\t\tfunction put(i, v){\n\t\t\t\t\tg[i] = v;\n\t\t\t\t\tR[RW[i]] ^= 1 << v;\n\t\t\t\t\tC[CL[i]] ^= 1 << v;\n\t\t\t\t\tB[BXA[i]] ^= 1 << v;\n\t\t\t\t\tif(cg){\n\t\t\t\t\t\tconst k = co[i];\n\t\t\t\t\t\tcs[k] += v;\n\t\t\t\t\t\tcn[k]++;\n\t\t\t\t\t\tcm[k] ^= 1 << v;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tfunction out(i, v){\n\t\t\t\t\tg[i] = 0;\n\t\t\t\t\tR[RW[i]] ^= 1 << v;\n\t\t\t\t\tC[CL[i]] ^= 1 << v;\n\t\t\t\t\tB[BXA[i]] ^= 1 << v;\n\t\t\t\t\tif(cg){\n\t\t\t\t\t\tconst k = co[i];\n\t\t\t\t\t\tcs[k] -= v;\n\t\t\t\t\t\tcn[k]--;\n\t\t\t\t\t\tcm[k] ^= 1 << v;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tfunction cand(i){\n\t\t\t\t\tlet m = ALL & ~(R[RW[i]]|C[CL[i]]|B[BXA[i]]);\n\t\t\t\t\tif(cg){\n\t\t\t\t\t\tconst k = co[i], left = cg[k].cells.length - cn[k] - 1, rem = cg[k].sum - cs[k], lst = CB[left + 1] && CB[left + 1][rem];\n\t\t\t\t\t\tm &= ~cm[k];\n\t\t\t\t\t\tlet ok = 0;\n\t\t\t\t\t\tif(lst){\n\t\t\t\t\t\t\tfor(const c of lst){\n\t\t\t\t\t\t\t\tif(!(c & cm[k])){\n\t\t\t\t\t\t\t\t\tok |= c;\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t\tm &= ok;\n\t\t\t\t\t}\n\t\t\t\t\treturn m;\n\t\t\t\t}\n\t\t\t\tfunction rec(){\n\t\t\t\t\tif(cnt >= limit || nodes > NL){\n\t\t\t\t\t\treturn;\n\t\t\t\t\t}\n\t\t\t\t\tnodes++;\n\t\t\t\t\tlet bi = -1, bm = 0, bc = N + 1;\n\t\t\t\t\tfor(let i = 0; i < NN; i++){\n\t\t\t\t\t\tif (!g[i]){\n\t\t\t\t\t\t\tconst m = cand(i), c = pc(m);\n\t\t\t\t\t\t\tif(c < bc){\n\t\t\t\t\t\t\t\tbc = c;\n\t\t\t\t\t\t\t\tbi = i;\n\t\t\t\t\t\t\t\tbm = m;\n\t\t\t\t\t\t\t\tif(c < 2){\n\t\t\t\t\t\t\t\t\tbreak;\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\tif(bi < 0){\n\t\t\t\t\t\tcnt++;\n\t\t\t\t\t\tif(!sol){\n\t\t\t\t\t\t\tsol = g.slice();\n\t\t\t\t\t\t}else if(!sol2){\n\t\t\t\t\t\t\tsol2 = g.slice();\n\t\t\t\t\t\t}\n\t\t\t\t\t\treturn;\n\t\t\t\t\t}\n\t\t\t\t\tif(!bc){\n\t\t\t\t\t\treturn;\n\t\t\t\t\t}\n\t\t\t\t\tconst vs = [];\n\t\t\t\t\tfor(let v = 1; v <= N; v++){\n\t\t\t\t\t\tif(bm >> v & 1){\n\t\t\t\t\t\t\tvs.push(v);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\tif(rand){\n\t\t\t\t\t\tvs.sort(() => Math.random() - .5);\n\t\t\t\t\t}\n\t\t\t\t\tfor(const v of vs){\n\t\t\t\t\t\tput(bi, v);\n\t\t\t\t\t\trec();\n\t\t\t\t\t\tout(bi, v);\n\t\t\t\t\t\tif(cnt >= limit || nodes > NL){\n\t\t\t\t\t\t\treturn;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif(init){\n\t\t\t\t\tfor(let i = 0; i < NN; i++){\n\t\t\t\t\t\tif(init[i]){\n\t\t\t\t\t\t\tput(i, init[i]);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\trec();\n\t\t\t\treturn {cnt, sol, sol2, to: nodes > NL};\n\t\t\t}\n\n\t\t\tfunction patternGrid(){\n\t\t\t\tconst shuf = a => a.sort(() => Math.random() - .5);\n\t\t\t\tconst sh = () => {\n\t\t\t\t\tconst o = [];\n\t\t\t\t\tfor(const a of shuf([...Array(BS).keys()])){\n\t\t\t\t\t\tfor(const b of shuf([...Array(BS).keys()])){\n\t\t\t\t\t\t\to.push(a*BS + b);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\treturn o;\n\t\t\t\t};\n\t\t\t\tconst rows = sh(), cols = sh(), dg = shuf([...Array(N).keys()].map(x => x + 1)), f = [];\n\t\t\t\tfor(let r = 0; r < N; r++){\n\t\t\t\t\tfor(let c = 0; c < N; c++){\n\t\t\t\t\t\tf.push(dg[(BS*(rows[r]%BS) + (rows[r]/BS|0) + cols[c])%N]);\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\treturn f;\n\t\t\t}\n\n\t\t\tconst nbr = c => {\n\t\t\t\tconst r = c/N|0, k = c%N, a = [];\n\t\t\t\tif(r > 0){\n\t\t\t\t\ta.push(c - N);\n\t\t\t\t}\n\t\t\t\tif(r < N - 1){\n\t\t\t\t\ta.push(c + N);\n\t\t\t\t}\n\t\t\t\tif(k > 0){\n\t\t\t\t\ta.push(c - 1);\n\t\t\t\t}\n\t\t\t\tif(k < N - 1){\n\t\t\t\t\ta.push(c + 1);\n\t\t\t\t}\n\t\t\t\treturn a;\n\t\t\t};\n\n\t\t\tfunction conn(cs){\n\t\t\t\tif(cs.length < 2){\n\t\t\t\t\treturn true;\n\t\t\t\t}\n\t\t\t\tconst st = new Set(cs), seen = new Set([cs[0]]), k = [cs[0]];\n\t\t\t\twhile(k.length){\n\t\t\t\t\tconst c = k.pop();\n\t\t\t\t\tfor(const n of nbr(c)){\n\t\t\t\t\t\tif(st.has(n) && !seen.has(n)){\n\t\t\t\t\t\t\tseen.add(n);\n\t\t\t\t\t\t\tk.push(n);\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\treturn seen.size === cs.length;\n\t\t\t}\n\n\t\t\tfunction splitCage(cages, q, sol){\n\t\t\t\tconst cs = q.cells, n = cs.length;\n\t\t\t\tlet a = null;\n\t\t\t\tfor(let t = 0; t < 15 && !a; t++){\n\t\t\t\t\tconst k = Math.max(1, Math.min(n - 1, Math.round(n/2))), part = [cs[Math.random()*n|0]];\n\t\t\t\t\twhile(part.length < k){\n\t\t\t\t\t\tconst fr = [];\n\t\t\t\t\t\tfor(const c of part){\n\t\t\t\t\t\t\tfor(const m of nbr(c)){\n\t\t\t\t\t\t\t\tif(cs.includes(m) && !part.includes(m)){\n\t\t\t\t\t\t\t\t\tfr.push(m);\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t\t
