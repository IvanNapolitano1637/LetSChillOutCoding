				--mut: #9aa5b6;

				--box: #212835;

		*{
			box-sizing: border-box
		}
		html{
			-webkit-text-size-adjust: 100%
		}
		body{
			margin: 0;
			font: 16px/1.55 Georgia, 'Iowan Old Style', 'Times New Roman', serif;
			background: var(--bg);
			color: var(--ink)
		}
		header, nav, main{
			max-width: 800px;
			margin: 0 auto;
			padding-left: 14px;
			padding-right: 14px
		}
		header{
			padding-top: 16px
		}
		h1{
			margin: 0 0 .2em;
			font-size: 1.5em;
			line-height: 1.25
		}
		h2{
			font-size: 1.15em;
			margin: 18px 0 4px;
			color: var(--acc)
		}
		nav{
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			padding-top: 10px;
			padding-bottom: 6px
		}
		main{
			padding-bottom: 60px
		}
		#q{
			width: 100%;
			font: inherit;
			padding: 9px 12px;
			margin: 6px 0 4px;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--bg);
			color: var(--ink)
		}
		.btn{
			font: inherit;
			font-size: 14px;
			background: var(--box);
			color: var(--ink);
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 6px 10px;
			cursor: pointer
		}
		.btn.on{
			background: var(--acc);
			color: var(--bg);
			border-color: var(--acc)
		}
		.btn:focus-visible, summary:focus-visible, #q:focus-visible{
			outline: 3px solid var(--acc);
			outline-offset: 2px
		}
		details{
			border: 1px solid var(--line);
			border-radius: 8px;
			margin: 10px 0
		}
		summary{
			cursor: pointer;
			padding: 11px 14px;
			font-weight: bold;
			color: var(--acc)
		}
		.in{
			padding: 0 14px 6px
		}
		.r{
			padding: 8px 0;
			border-top: 1px solid var(--line)
		}
		.r b, .r span, .r small{
			display: block
		}
		.f{
			background: var(--box);
			border-radius: 5px;
			padding: 4px 8px;
			margin: 4px 0;
			overflow-x: auto;
			font-family: 'Cambria Math', 'Segoe UI Symbol', Georgia, serif
		}
		.r small{
			color: var(--mut);
			font-size: .9em
		}
		.mut{
			color: var(--mut)
		}
		</style>

			function go(i){
				cur = i;
				$('q').value = '';
				draw();
			}
			function draw(){
				const q = $('q').value.trim().toLowerCase();
				[...$('nav').children].forEach((b, j) => b.classList.toggle('on', !q && j == cur));
				$('ct').textContent = '';
				let n = 0;
				F.forEach((s, i) => {
					if(!q && i != cur){
						return;
					}
					const box = mk('div');
					s[1].forEach(([st, rows], j) => {
						const f = rows.filter(r => !q || r.join(' ').toLowerCase().includes(q));
						if(!f.length){
							return;
						}
						n += f.length;
						const d = mk('details');
						d.open = !!q || j == 0;
						d.append(mk('summary', '', st));
						const w = mk('div', 'in');
						f.forEach(r => {
							const e = mk('div', 'r');
							e.append(mk('b', '', r[0]));
							if(r[1]){
								e.append(mk('span', 'f', r[1]));
							}
							if(r[2]){
								e.append(mk('small', '', r[2]));
							}
							w.append(e);
						});
						d.append(w);
						box.append(d);
					});
					if(box.children.length){
						if(q){
							$('ct').append(mk('h2', '', s[0]));
						}
						$('ct').append(box);
					}
				});
				if(!n){
					$('ct').append(mk('p', 'mut', 'Nessun risultato.'));
				}
			}
			$('q').oninput = draw;
			$('apri').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
			$('chiudi').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
			go(0);
		</script>
	</body>
</html>
