				["Sport e salute","Il cibo caduto per terra è sicuro se lo raccogli entro 5 secondi.","I batteri si trasferiscono quasi subito: dipende da superficie e umidità, non dal tempo."],
				["Sport e salute","L’abbronzatura protegge la pelle.","È una reazione di difesa al danno da raggi UV: non sostituisce la crema solare."],
				["Italia","La carbonara tradizionale si fa con la panna.","La ricetta tradizionale prevede guanciale, uova, pecorino e pepe: niente panna, né cipolla o pancetta affumicata."],
				["Italia","La pizza Margherita fu inventata nel 1889 per la regina Margherita, con i colori della bandiera.","Pizze simili esistevano già: la storia è stata molto abbellita e ricostruita in seguito."],
				["Italia","Pompei fu distrutta dalla lava del Vesuvio.","Il Vesuvio non emise lava: la città fu sepolta da cenere e lapilli e travolta da flussi piroclastici."],
				["Italia","Il Vesuvio è un vulcano estinto.","È attivo e in quiescenza: l’ultima eruzione risale al 1944."],
				["Italia","La Torre di Pisa fu costruita pendente di proposito.","Il terreno cedette già durante la costruzione. Oggi è stata stabilizzata con interventi di ingegneria."],
				["Italia","Gli spaghetti con le polpette sono un piatto tradizionale italiano.","Sono un piatto italoamericano, nato negli Stati Uniti."],
				["Italia","Il colpo d’aria e la corrente causano malanni.","I malanni sono causati da virus e batteri: la corrente d’aria non è in sé una causa di malattia."],
				["Italia","I colori del Tricolore rappresentano fede, speranza e carità.","È un’interpretazione posteriore: i colori derivano dalle insegne repubblicane di fine Settecento."],
				["Italia","Roma fu fondata da Romolo nel 753 a.C.","È la data tradizionale (leggendaria): l’archeologia mostra una formazione graduale dell’abitato nel tempo."],
				["Italia","L’olio extravergine d’oliva non si può usare per friggere.","Ha un punto di fumo adatto alla frittura, ed è anzi molto stabile alle alte temperature."],
				["Italia","Il sale nell’acqua della pasta la fa bollire prima.","Ne altera appena il punto di ebollizione. Serve a dare sapore alla pasta."],
				["Italia","Il pomodoro è un ortaggio.","In botanica è un frutto (una bacca), anche se in cucina si usa come ortaggio."]
			];

			var T = [
				["Curiosità","Il miele non scade.","Se ben conservato resta commestibile per tempi lunghissimi: ne è stato trovato di ancora buono in tombe egizie."],
				["Curiosità","Cleopatra visse più vicina nel tempo allo sbarco sulla Luna che alla costruzione della Grande Piramide.","La Grande Piramide è del 2560 a.C. circa, Cleopatra visse intorno al 50 a.C. (circa 2500 anni dopo) e lo sbarco sulla Luna è del 1969 (circa 2000 anni dopo)."],
				["Curiosità","Gli squali esistono da prima degli alberi.","I primi squali risalgono a circa 450 milioni di anni fa, i primi alberi a circa 385."],
				["Curiosità","L’Università di Oxford è più antica dell’impero azteco.","A Oxford si insegnava già nel 1096; Tenochtitlan fu fondata nel 1325."],
				["Curiosità","Su Venere un giorno dura più di un anno.","Ruota su se stesso in 243 giorni terrestri e gira intorno al Sole in 225."],
				["Curiosità","La Russia ha una superficie maggiore di quella di Plutone.","Circa 17,1 milioni di km² contro circa 16,7 milioni."],
				["Curiosità","La Torre Eiffel è più alta d’estate che d’inverno.","Il ferro si dilata col caldo: la differenza può arrivare a una quindicina di centimetri."],
				["Curiosità","Il Nilo scorre da sud verso nord.","Nasce nell’Africa centro-orientale e sfocia nel Mediterraneo."],
				["Curiosità","Gli astronauti sulla ISS diventano più alti.","Senza il peso sulla colonna vertebrale, i dischi si distendono: la crescita può arrivare a qualche centimetro, poi sparisce al ritorno."],
				["Curiosità","Il Sole è circa 400 volte più grande della Luna ed è circa 400 volte più lontano.","Per questa coincidenza, nelle eclissi totali i due dischi appaiono quasi uguali."],
				["Animali","I polpi hanno tre cuori.","Due servono per le branchie e uno per il resto del corpo."],
				["Animali","Le stelle marine non hanno un cervello.","Hanno un sistema nervoso diffuso, ma non un cervello centrale."],
				["Animali","Le giraffe hanno lo stesso numero di vertebre del collo degli esseri umani.","Ne hanno sette, come quasi tutti i mammiferi, ma molto più lunghe."],
				["Animali","Gli elefanti non riescono a saltare.","Per la struttura delle zampe e per il peso non possono staccarsi da terra."],
				["Animali","I wombat producono feci a forma di cubo.","È dovuto alla diversa elasticità delle pareti dell’intestino."],
				["Animali","Le impronte digitali dei koala sono molto simili a quelle umane.","Sono così simili da poter essere confuse al microscopio."],
				["Scienza e natura","Le banane sono leggermente radioattive.","Contengono potassio-40, ma in quantità così bassa da essere innocua."],
				["Scienza e natura","In botanica una banana è una bacca mentre una fragola no.","Una fragola è un falso frutto formato dal ricettacolo, i suoi «semi» sono frutti secchi."],
				["Scienza e natura","Il ghiaccio galleggia perché l’acqua è più densa a circa 4 °C che a 0 °C.","È un’anomalia dell’acqua: è ciò che permette ai laghi di non congelare dal fondo."],
				["Scienza e natura","Il cervello umano consuma circa il 20% dell’energia del corpo.","Pesa solo il 2% circa, ma è un organo molto dispendioso."],
				["Scienza e natura","L’oro è commestibile.","Si usa come additivo alimentare (E175), ma non apporta nutrienti."],
				["Curiosità","La Città del Vaticano è lo Stato più piccolo del mondo.","Ha una superficie di circa 0,44 km², meno di un decimo di Central Park."]
			];

			var cat = "Tutti", q = "";

			function esc(s){
				return s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
			}

			function render(){
				var h = "", k = 0;
				D.forEach(function (d){
					if(cat != "Tutti" && d[0] != cat){
						return;
					}
					if(q && (d[1] + " " + d[2]).toLowerCase().indexOf(q) < 0){
						return;
					}
					k++;
					h += '<div class="c"><div class="t">' + d[0] + '</div><div class="m">✗ ' + esc(d[1]) + '</div><p class="r"><b>✓ In realtà:</b> ' + esc(d[2]) + '</p></div>';
				});
				document.getElementById("list").innerHTML = h || '<p class="sub">Nessun risultato.</p>';
				document.getElementById("n").textContent = k + " su " + D.length + " miti";
			}

			var cs = ["Tutti"];

			D.forEach(function (d){
				if(cs.indexOf(d[0]) < 0){
					cs.push(d[0]);
				}
			});

			var cb = document.getElementById("cats");

			cs.forEach(function (c){
				var b = document.createElement("button");
				b.textContent = c;
				b.onclick = function (){
					cat = c;
					Array.prototype.forEach.call(cb.children, function (x){
						x.className = x == b ? "on" : "";
					});
					render();
				};
				if(c == "Tutti"){
					b.className = "on";
				}
				cb.appendChild(b);
			});

			var qz = document.getElementById("quiz"), qs = 0, qn = 0;

			function mode(z){
				["list", "n", "q"].forEach(function (i){
					document.getElementById(i).hidden = z;
				});
				qz.hidden = !z;
			}

			Array.prototype.slice.call(cb.children).forEach(function (b){
				b.addEventListener("click", function (){
					mode(false);
				});
			});

			var qb = document.createElement("button");
			qb.textContent = "🎯 Quiz vero o falso";
			qb.onclick = function (){
				Array.prototype.forEach.call(cb.children, function (x){
					x.className = x == qb ? "on" : "";
				});
				mode(true);
				nq();
			};
			cb.appendChild(qb);

			function score(){
				return "<p class='sub'>Risposte esatte: " + qs + " su " + qn + "</p>";
			}

			function nq(){
				var f = Math.random() < .5,
					A = f ? D : T,
					d = A[Math.floor(Math.random() * A.length)],
					vera = !f;
				qz.innerHTML = "<div class='c'><div class='t'>" + d[0] + "</div>" +
					"<div class='m big' style='color:var(--tx)'>«" + esc(d[1]) + "»</div>" +
					"<p class='sub'>Vera o falsa?</p>" +
					"<button id='y'>Vera</button><button id='k'>Falsa</button></div>" + score();
				function ans(v){
					var ok = v == vera;
					qn++;
					if(ok){
						qs++;
					}
					qz.innerHTML = "<div class='c'><div class='t'>" + d[0] + "</div>" +
						"<div class='m' style='color:var(--tx)'>«" + esc(d[1]) + "»</div>" +
						"<p class='r'><b style='color:var(--" + (ok ? "ok" : "ko") + ")'>" + (ok ? "✓ Esatto!" : "✗ Sbagliato.") + "</b> " +
						"Era " + (vera ? "vera" : "falsa") + ". " + (f ? "In realtà: " : "") + esc(d[2]) + "</p>" +
						"<button id='nx'>Prossima</button></div>" + score();
					document.getElementById("nx").onclick = nq;
				}
				document.getElementById("y").onclick = function (){
					ans(true);
				};
				document.getElementById("k").onclick = function (){
					ans(false);
				};
			}

			document.getElementById("q").oninput = function () {
				q = this.value.toLowerCase().trim();
				render();
			};

			render();
		</script>
	</body>
</html>
