<!DOCTYPE html>
<html lang="it"><!--L08#042 - Salvatore - Identikit Forense-->
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>Identikit Forense</title>
		<style>
			*{
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body{
				font-family: 'Courier New', monospace;
				background: #1a1a1a;
				color: #e0e0e0;
				min-height: 100vh;
				padding: 10px;
			}
			header{
				text-align: center;
				padding: 10px;
				border-bottom: 2px solid #444;
				margin-bottom: 15px;
			}
			header h1{
				font-size: 1.5em;
				letter-spacing: 3px;
				color: #ffcc00;
			}
			header p{
				font-size: 0.85em;
				color: #999;
				margin-top: 4px;
			}
			.container{
				display: flex;
				flex-wrap: wrap;
				gap: 15px;
				max-width: 1200px;
				margin: 0 auto;
			}
			.face-panel{
				flex: 1 1 360px;
				background: #2a2a2a;
				border: 2px solid #444;
				border-radius: 8px;
				padding: 15px;
				display: flex;
				flex-direction: column;
				align-items: center;
			}
			.face-panel svg{
				width: 100%;
				max-width: 420px;
				height: auto;
				background: radial-gradient(circle at 50% 40%, #e8e8e8, #b0b0b0);
				border: 1px solid #555;
				border-radius: 4px;
			}
			.suspect-name{
				margin-top: 10px;
				font-size: 1.1em;
				color: #ffcc00;
				letter-spacing: 2px;
				text-align: center;
			}
			.controls{
				flex: 1 1 360px;
				background: #2a2a2a;
				border: 2px solid #444;
				border-radius: 8px;
				padding: 15px;
				max-height: 85vh;
				overflow-y: auto;
			}
			.controls::-webkit-scrollbar{
				width: 8px;
			}
			.controls::-webkit-scrollbar-thumb{
				background: #555;
				border-radius: 4px;
			}
			.section{
				margin-bottom: 15px;
				padding-bottom: 10px;
				border-bottom: 1px dashed #444;
			}
			.section h3{
				color: #ffcc00;
				font-size: 0.95em;
				margin-bottom: 8px;
				letter-spacing: 1px;
			}
			.control-row{
				display: flex;
				align-items: center;
				margin-bottom: 6px;
				gap: 8px;
			}
			.control-row label{
				flex: 0 0 110px;
				font-size: 0.85em;
				color: #ccc;
			}
			.control-row input[type="range"]{
				flex: 1;
				min-width: 0;
			}
			.control-row input[type="color"]{
				width: 40px;
				height: 28px;
				border: none;
				background: none;
				cursor: pointer;
			}
			.control-row select{
				flex: 1;
				background: #333;
				color: #e0e0e0;
				border: 1px solid #555;
				padding: 4px;
				border-radius: 3px;
				font-family: inherit;
			}
			.val{
				flex: 0 0 35px;
				text-align: right;
				font-size: 0.8em;
				color: #888;
			}
			.buttons{
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-top: 10px;
			}
			button{
				flex: 1 1 100px;
				padding: 10px;
				background: #444;
				color: #ffcc00;
				border: 1px solid #666;
				border-radius: 4px;
				cursor: pointer;
				font-family: inherit;
				font-size: 0.9em;
				letter-spacing: 1px;
				transition: background 0.2s;
			}
			button:hover, button:active{
				background: #555;
			}
			button.primary{
				background: #8a6d00;
				color: #fff;
			}
			button.primary:hover{
				background: #a88500;
			}
			@media(max-width: 700px){
				header h1{
					font-size: 1.2em;
				}
				.control-row label{
					flex: 0 0 90px;
					font-size: 0.78em;
				}
				.controls{
					max-height: none;
				}
				body{
					padding: 5px;
				}
			}
		</style>
	</head>
	<body>
	<header>
		<h1>🕵️ IDENTIKIT FORENSE</h1>
		<p>Ricostruzione fisionomica del sospettato</p>
	</header>
	<div class="container">
		<div class="face-panel">
			<svg id="face" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg"></svg>
			<div class="suspect-name" id="suspectName">SOSPETTO #0000</div>
			<div class="buttons">
				<button onclick="randomize()">🎲 CASUALE</button>
				<button onclick="resetAll()">↺ RESET</button>
				<button onclick="newName()">🔀 NOME</button>
			</div>
			<div class="buttons">
				<button class="primary" onclick="exportPNG()">💾 SALVA PNG</button>
				<button class="primary" onclick="exportSVG()">💾 SALVA SVG</button>
			</div>
		</div>
		<div class="controls">
			<div class="section">
				<h3>VISO</h3>
				<div class="control-row">
					<label>Forma</label>
					<select id="faceShape" onchange="update()">
						<option value="0">Ovale</option>
						<option value="1">Tondo</option>
						<option value="2">Squadrato</option>
						<option value="3">Lungo</option>
						<option value="4">A cuore</option>
						<option value="5">Diamante</option>
						<option value="6">Triangolare (mascella larga)</option>
						<option value="7">Rettangolare</option>
					</select>
				</div>
				<div class="control-row">
					<label>Larghezza</label>
					<input type="range" id="faceWidth" min="70" max="130" value="100" oninput="update()">
					<span class="val" id="faceWidthV">100</span>
				</div>
				<div class="control-row">
					<label>Altezza</label>
					<input type="range" id="faceHeight" min="80" max="125" value="100" oninput="update()">
					<span class="val" id="faceHeightV">100</span>
				</div>
				<div class="control-row">
					<label>Colore pelle</label>
					<input type="color" id="skinColor" value="#e8b890" oninput="update()">
				</div>
				<div class="control-row">
					<label>Età</label>
					<input type="range" id="age" min="18" max="85" value="35" oninput="update()">
					<span class="val" id="ageV">35</span>
				</div>
				<div class="control-row">
					<label>Magro/Grasso</label>
					<input type="range" id="chubbiness" min="-30" max="30" value="0" oninput="update()">
					<span class="val" id="chubbinessV">0</span>
				</div>
			</div>
			<div class="section">
				<h3>OCCHI</h3>
				<div class="control-row">
					<label>Forma</label>
					<select id="eyeShape" onchange="update()">
						<option value="0">Standard</option>
						<option value="1">A mandorla</option>
						<option value="2">Cadenti</option>
						<option value="3">Sollevati</option>
						<option value="4">Stretti</option>
					</select>
				</div>
				<div class="control-row">
					<label>Distanza</label>
					<input type="range" id="eyeDist" min="70" max="130" value="100" oninput="update()">
					<span class="val" id="eyeDistV">100</span>
				</div>
				<div class="control-row">
					<label>Dimensione</label>
					<input type="range" id="eyeSize" min="70" max="130" value="100" oninput="update()">
					<span class="val" id="eyeSizeV">100</span>
				</div>
				<div class="control-row">
					<label>Altezza</label>
					<input type="range" id="eyeHeight" min="85" max="115" value="100" oninput="update()">
					<span class="val" id="eyeHeightV">100</span>
				</div>
				<div class="control-row">
					<label>Pupilla</label>
					<input type="range" id="pupilSize" min="50" max="150" value="100" oninput="update()">
					<span class="val" id="pupilSizeV">100</span>
				</div>
				<div class="control-row">
					<label>Colore occhi</label>
					<input type="color" id="eyeColor" value="#6b4423" oninput="update()">
				</div>
			</div>
			<div class="section">
				<h3>SOPRACCIGLIA</h3>
				<div class="control-row">
					<label>Spessore</label>
					<input type="range" id="browThick" min="1" max="10" value="4" oninput="update()">
					<span class="val" id="browThickV">4</span>
				</div>
				<div class="control-row">
					<label>Inclinazione</label>
					<input type="range" id="browAngle" min="-25" max="25" value="0" oninput="update()">
					<span class="val" id="browAngleV">0</span>
				</div>
				<div class="control-row">
					<label>Colore</label>
					<input type="color" id="browColor" value="#3a2820" oninput="update()">
				</div>
			</div>
			<div class="section">
				<h3>NASO</h3>
				<div class="control-row">
					<label>Lunghezza</label>
					<input type="range" id="noseLen" min="75" max="130" value="100" oninput="update()">
					<span class="val" id="noseLenV">100</span>
				</div>
				<div class="control-row">
					<label>Larghezza</label>
					<input type="range" id="noseWidth" min="70" max="140" value="100" oninput="update()">
					<span class="val" id="noseWidthV">100</span>
				</div>
				<div class="control-row">
					<label>Stile</label>
					<select id="noseStyle" onchange="update()">
						<option value="0">Dritto</option>
						<option value="1">Aquilino</option>
						<option value="2">A bottoncino</option>
						<option value="3">Largo</option>
						<option value="4">Storto</option>
					</select>
				</div>
			</div>
			<div class="section">
				<h3>BOCCA</h3>
				<div class="control-row">
					<label>Larghezza</label>
					<input type="range" id="mouthWidth" min="60" max="140" value="100" oninput="update()">
					<span class="val" id="mouthWidthV">100</span>
				</div>
				<div class="control-row">
					<label>Sorriso</label>
					<input type="range" id="smile" min="-100" max="100" value="0" oninput="update()">
					<span class="val" id="smileV">0</span>
				</div>
				<div class="control-row">
					<label>Labbra</label>
					<input type="range" id="lipSize" min="50" max="160" value="100" oninput="update()">
					<span class="val" id="lipSizeV">100</span>
				</div>
				<div class="control-row">
					<label>Colore labbra</label>
					<input type="color" id="lipColor" value="#b86858" oninput="update()">
				</div>
			</div>
			<div class="section">
				<h3>CAPELLI</h3>
				<div class="control-row">
					<label>Stile</label>
					<select id="hairStyle" onchange="update()">
						<option value="0">Calvo</option>
						<option value="1" selected>Corti</option>
						<option value="2">Medi</option>
						<option value="3">Lunghi</option>
						<option value="4">Ricci</option>
						<option value="5">Raccolti</option>
						<option value="6">Moicano</option>
						<option value="7">Rigati lateralmente</option>
						<option value="8">Rasati</option>
						<option value="9">Afro</option>
						<option value="10">Con frangia</option>
					</select>
				</div>
				<div class="control-row">
					<label>Colore</label>
					<input type="color" id="hairColor" value="#3a2820" oninput="update()">
				</div>
				<div class="control-row">
					<label>Entrate</label>
					<input type="range" id="baldness" min="0" max="100" value="0" oninput="update()">
					<span class="val" id="baldnessV">0</span>
				</div>
			</div>
			<div class="section">
				<h3>BARBA / PELI</h3>
				<div class="control-row">
					<label>Stile</label>
					<select id="beardStyle" onchange="update()">
						<option value="0">Nessuna</option>
						<option value="1">Pizzetto</option>
						<option value="2">Corta (3 giorni)</option>
						<option value="3">Folta</option>
						<option value="4">Baffi</option>
						<option value="5">Basette lunghe</option>
						<option value="6">Barba alla Lenin</option>
						<option value="7">Pizzetto e baffi</option>
						<option value="8">Barba a collare</option>
					</select>
				</div>
				<div class="control-row">
					<label>Colore</label>
					<input type="color" id="beardColor" value="#3a2820" oninput="update()">
				</div>
			</div>
			<div class="section">
				<h3>DETTAGLI</h3>
				<div class="control-row">
					<label>Orecchie</label>
					<input type="range" id="earSize" min="70" max="140" value="100" oninput="update()">
					<span class="val" id="earSizeV">100</span>
				</div>
				<div class="control-row">
					<label>Nei</label>
					<input type="range" id="moles" min="0" max="5" value="0" step="1" oninput="update()">
					<span class="val" id="molesV">0</span>
				</div>
				<div class="control-row">
					<label>Rughe</label>
					<input type="range" id="wrinkles" min="0" max="100" value="0" oninput="update()">
					<span class="val" id="wrinklesV">0</span>
				</div>
				<div class="control-row">
					<label>Lentiggini</label>
					<input type="range" id="freckles" min="0" max="100" value="0" oninput="update()">
					<span class="val" id="frecklesV">0</span>
				</div>
				<div class="control-row">
					<label>Cicatrice</label>
					<select id="scar" onchange="update()">
						<option value="0">Nessuna</option>
						<option value="1">Guancia sinistra</option>
						<option value="2">Guancia destra</option>
						<option value="3">Sopracciglio sinistro</option>
						<option value="4">Sopracciglio destro</option>
						<option value="5">Mento</option>
					</select>
				</div>
				<div class="control-row">
					<label>Occhiali</label>
					<select id="glasses" onchange="update()">
						<option value="0">Nessuno</option>
						<option value="1">Tondi</option>
						<option value="2">Quadrati</option>
						<option value="3">Da sole</option>
						<option value="4">Aviator</option>
						<option value="5">Ovali</option>
						<option value="6">Senza montatura</option>
					</select>
				</div>
			</div>
		</div>
	</div>
		<script>
			const defaults = {
				faceShape: 0, faceWidth: 100, faceHeight: 100, skinColor: "#e8b890", age: 35, chubbiness: 0,
				eyeShape: 0, eyeDist: 100, eyeSize: 100, eyeHeight: 100, eyeColor: "#6b4423",
				browThick: 4, browAngle: 0, browColor: "#3a2820",
				noseLen: 100, noseWidth: 100, noseStyle: 0,
				mouthWidth: 100, smile: 0, lipSize: 100, lipColor: "#b86858",
				hairStyle: 1, hairColor: "#3a2820", baldness: 0,
				beardStyle: 0, beardColor: "#3a2820",
				earSize: 100, moles: 0, wrinkles: 0, glasses: 0, pupilSize: 100, freckles: 0, scar: 0
			};
			let state = {...defaults};
			let suspectCode = Math.floor(Math.random()*9999).toString().padStart(4, '0');
			const firstNames = ["MARIO","LUIGI","GIUSEPPE","ANTONIO","FRANCO","ROBERTO","MARCO","GIOVANNI","CARLO","PAOLO","ANDREA","STEFANO","ALESSANDRO","LUCA","VINCENZO","SALVATORE","DOMENICO","PIETRO","MATTEO","NICOLA"];
			const lastNames = ["ROSSI","RUSSO","FERRARI","ESPOSITO","BIANCHI","ROMANO","COLOMBO","RICCI","MARINO","GRECO","BRUNO","GALLO","CONTI","DE LUCA","MANCINI","COSTA","GIORDANO","RIZZO","LOMBARDI","MORETTI"];

			function newName(){
				const f = firstNames[Math.floor(Math.random()*firstNames.length)];
				const l = lastNames[Math.floor(Math.random()*lastNames.length)];
				suspectCode = Math.floor(Math.random()*9999).toString().padStart(4, '0');
				document.getElementById('suspectName').textContent = `SOSPETTO: ${f} ${l} #${suspectCode}`;
			}

			function getVal(id){
				const el = document.getElementById(id);
				if(el.type === 'color'){
					return el.value;
				}
				if(el.type === 'select-one'){
					return el.value.charAt(0) === '#' ? el.value : parseInt(el.value);
				}
				return parseFloat(el.value);
			}

			function readState(){
				for(const k in defaults){
					state[k] = getVal(k);
					const vEl = document.getElementById(k + 'V');
					if(vEl){
						vEl.textContent = state[k];
					}
				}
			}

			function darken(hex, amount){
				const n = parseInt(hex.slice(1), 16);
				let r = Math.max(0, (n >> 16) - amount);
				let g = Math.max(0, ((n >> 8) & 0xff) - amount);
				let b = Math.max(0, (n & 0xff) - amount);
				return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
			}

			function lighten(hex, amount){
				const n = parseInt(hex.slice(1), 16);
				let r = Math.min(255, (n >> 16) + amount);
				let g = Math.min(255, ((n >> 8) & 0xff) + amount);
				let b = Math.min(255, (n & 0xff) + amount);
				return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
			}

			function mix(hex1, hex2, t){
				const a = parseInt(hex1.slice(1), 16);
				const b = parseInt(hex2.slice(1), 16);
				const r = Math.round(((a >> 16)*(1-t)) + ((b >> 16)*t));
				const g = Math.round((((a >> 8) & 0xff)*(1-t)) + (((b >> 8) & 0xff)*t));
				const bl = Math.round(((a & 0xff)*(1-t)) + ((b & 0xff)*t));
				return '#' + ((r << 16) | (g << 8) | bl).toString(16).padStart(6, '0');
			}

			let _seed = 1;

			function rnd(){
				_seed = (_seed + 0x6D2B79F5) | 0;
				let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
				t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
				return ((t ^ (t >>> 14)) >>> 0)/4294967296;
			}

			function buildFace(){
				_seed = parseInt(suspectCode, 10) + 1;
				const s = state;
				const cx = 200, cy = 270;
				const w = 130*(s.faceWidth/100);
				const h = 170*(s.faceHeight/100);
				const chub = s.chubbiness;
				const wChub = w + chub*0.8;
				const hChub = h - chub*0.3;
				const skinBase = s.skinColor;
				const skinDark = darken(skinBase, 35);
				const skinMid = darken(skinBase, 15);
				const skinLight = lighten(skinBase, 20);
				let facePath;
				switch (s.faceShape){
					case 0:
						facePath = `M ${cx-wChub} ${cy-hChub*0.3} Q ${cx-wChub} ${cy-hChub} ${cx} ${cy-hChub} Q ${cx+wChub} ${cy-hChub} ${cx+wChub} ${cy-hChub*0.3} Q ${cx+wChub} ${cy+hChub*0.7} ${cx} ${cy+hChub} Q ${cx-wChub} ${cy+hChub*0.7} ${cx-wChub} ${cy-hChub*0.3} Z`;
						break;
					case 1:
						facePath = `M ${cx-wChub} ${cy} A ${wChub} ${hChub} 0 1 1 ${cx+wChub} ${cy} A ${wChub} ${hChub} 0 1 1 ${cx-wChub} ${cy} Z`;
						break;
					case 2:
						facePath = `M ${cx-wChub} ${cy-hChub*0.3} Q ${cx-wChub} ${cy-hChub} ${cx} ${cy-hChub} Q ${cx+wChub} ${cy-hChub} ${cx+wChub} ${cy-hChub*0.3} L ${cx+wChub*0.95} ${cy+hChub*0.6} Q ${cx+wChub*0.5} ${cy+hChub} ${cx} ${cy+hChub} Q ${cx-wChub*0.5} ${cy+hChub} ${cx-wChub*0.95} ${cy+hChub*0.6} Z`;
						break;
					case 3:
						facePath = `M ${cx-wChub*0.9} ${cy-hChub*0.5} Q ${cx-wChub*0.9} ${cy-hChub} ${cx} ${cy-hChub} Q ${cx+wChub*0.9} ${cy-hChub} ${cx+wChub*0.9} ${cy-hChub*0.5} L ${cx+wChub*0.85} ${cy+hChub*0.7} Q ${cx+wChub*0.4} ${cy+hChub*1.05} ${cx} ${cy+hChub*1.05} Q ${cx-wChub*0.4} ${cy+hChub*1.05} ${cx-wChub*0.85} ${cy+hChub*0.7} Z`;
						break;
					case 4:
						facePath = `M ${cx-wChub} ${cy-hChub*0.3} Q ${cx-wChub} ${cy-hChub} ${cx} ${cy-hChub} Q ${cx+wChub} ${cy-hChub} ${cx+wChub} ${cy-hChub*0.3} Q ${cx+wChub*0.95} ${cy+hChub*0.3} ${cx} ${cy+hChub*1.05} Q ${cx-wChub*0.95} ${cy+hChub*0.3} ${cx-wChub} ${cy-hChub*0.3} Z`;
						break;
					case 6:

							break;
						case 2:
							glasses = `<rect x="${cx-eyeSpacing-gW}" y="${eyeY-gH}" width="${gW*2}" height="${gH*2}" fill="none" stroke="${gCol}" stroke-width="2.5" rx="3"/><rect x="${cx+eyeSpacing-gW}" y="${eyeY-gH}" width="${gW*2}" height="${gH*2}" fill="none" stroke="${gCol}" stroke-width="2.5" rx="3"/><line x1="${cx-eyeSpacing+gW}" y1="${eyeY}" x2="${cx+eyeSpacing-gW}" y2="${eyeY}" stroke="${gCol}" stroke-width="2.5"/><line x1="${cx-eyeSpacing-gW}" y1="${eyeY}" x2="${cx-wChub-earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="2"/><line x1="${cx+eyeSpacing+gW}" y1="${eyeY}" x2="${cx+wChub+earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="2"/>`;
							break;
						case 3:
							glasses = `<path d="M ${cx-eyeSpacing-gW} ${eyeY-gH} L ${cx-eyeSpacing+gW} ${eyeY-gH} L ${cx-eyeSpacing+gW*0.8} ${eyeY+gH} L ${cx-eyeSpacing-gW*0.8} ${eyeY+gH} Z" fill="#111" fill-opacity="0.75" stroke="${gCol}" stroke-width="2"/><path d="M ${cx+eyeSpacing-gW} ${eyeY-gH} L ${cx+eyeSpacing+gW} ${eyeY-gH} L ${cx+eyeSpacing+gW*0.8} ${eyeY+gH} L ${cx+eyeSpacing-gW*0.8} ${eyeY+gH} Z" fill="#111" fill-opacity="0.75" stroke="${gCol}" stroke-width="2"/><line x1="${cx-eyeSpacing+gW}" y1="${eyeY}" x2="${cx+eyeSpacing-gW}" y2="${eyeY}" stroke="${gCol}" stroke-width="2.5"/><line x1="${cx-eyeSpacing-gW}" y1="${eyeY}" x2="${cx-wChub-earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="2"/><line x1="${cx+eyeSpacing+gW}" y1="${eyeY}" x2="${cx+wChub+earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="2"/>`;
							break;
						case 5:
						case 6:{
							const rim = s.glasses === 5;
							const lens = (ex) => `<ellipse cx="${ex}" cy="${eyeY}" rx="${gW*1.15}" ry="${gH*0.85}" fill="${rim?'none':'#aaccee'}" fill-opacity="${rim?0:0.25}" stroke="${gCol}" stroke-width="${rim?2.5:0.9}"/>`;
							glasses = lens(cx-eyeSpacing) + lens(cx+eyeSpacing) + `<line x1="${cx-eyeSpacing+gW*1.15}" y1="${eyeY}" x2="${cx+eyeSpacing-gW*1.15}" y2="${eyeY}" stroke="${gCol}" stroke-width="${rim?2.5:1}"/><line x1="${cx-eyeSpacing-gW*1.15}" y1="${eyeY}" x2="${cx-wChub-earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="${rim?2:1}"/><line x1="${cx+eyeSpacing+gW*1.15}" y1="${eyeY}" x2="${cx+wChub+earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="${rim?2:1}"/>`;
							break;
						}
						case 4:
							glasses = `<path d="M ${cx-eyeSpacing-gW} ${eyeY-gH*0.5} Q ${cx-eyeSpacing-gW} ${eyeY+gH} ${cx-eyeSpacing} ${eyeY+gH*1.1} Q ${cx-eyeSpacing+gW} ${eyeY+gH} ${cx-eyeSpacing+gW} ${eyeY-gH*0.5} Z" fill="#88aacc" fill-opacity="0.5" stroke="${gCol}" stroke-width="2"/><path d="M ${cx+eyeSpacing-gW} ${eyeY-gH*0.5} Q ${cx+eyeSpacing-gW} ${eyeY+gH} ${cx+eyeSpacing} ${eyeY+gH*1.1} Q ${cx+eyeSpacing+gW} ${eyeY+gH} ${cx+eyeSpacing+gW} ${eyeY-gH*0.5} Z" fill="#88aacc" fill-opacity="0.5" stroke="${gCol}" stroke-width="2"/><line x1="${cx-eyeSpacing+gW}" y1="${eyeY-gH*0.3}" x2="${cx+eyeSpacing-gW}" y2="${eyeY-gH*0.3}" stroke="${gCol}" stroke-width="2"/><line x1="${cx-eyeSpacing-gW}" y1="${eyeY-gH*0.3}" x2="${cx-wChub-earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="2"/><line x1="${cx+eyeSpacing+gW}" y1="${eyeY-gH*0.3}" x2="${cx+wChub+earW*0.3}" y2="${eyeY-3}" stroke="${gCol}" stroke-width="2"/>`;
							break;
					}
				}
				const neck = `
					<path d="M ${cx-wChub*0.35} ${cy+hChub*0.95} L ${cx-wChub*0.42} ${cy+hChub*1.35} L ${cx+wChub*0.42} ${cy+hChub*1.35} L ${cx+wChub*0.35} ${cy+hChub*0.95} Z" fill="url(#skinGrad)" stroke="${skinDark}" stroke-width="0.8"/>
					<ellipse cx="${cx}" cy="${cy+hChub*1.02}" rx="${wChub*0.4}" ry="6" fill="${skinDark}" opacity="0.4" filter="url(#faceBlur)"/>
				`;
				return `
					${defs}${defs2}
					${neck}
					${ears}
					<path d="${facePath}" fill="url(#skinGrad)" stroke="${skinDark}" stroke-width="1.2"/>
					<path d="${facePath}" fill="url(#sideShadowL)" opacity="0.6"/>
					<path d="${facePath}" fill="url(#sideShadowR)" opacity="0.6"/>
					<g clip-path="url(#faceClip)">
						<ellipse cx="${cx}" cy="${cy-hChub*0.62}" rx="${wChub*0.55}" ry="${hChub*0.18}" fill="${skinLight}" opacity="0.35" filter="url(#faceBlur)"/>
						<ellipse cx="${cx}" cy="${noseTop+noseLen*0.5}" rx="${noseW*0.35}" ry="${noseLen*0.45}" fill="${lighten(skinBase,35)}" opacity="0.3" filter="url(#faceBlur)"/>
						<ellipse cx="${cx-noseW*1.7}" cy="${noseTop+noseLen*0.4}" rx="4" ry="${noseLen*0.4}" fill="${skinDark}" opacity="0.2" filter="url(#faceBlur)"/>
						<ellipse cx="${cx+noseW*1.7}" cy="${noseTop+noseLen*0.4}" rx="4" ry="${noseLen*0.4}" fill="${skinDark}" opacity="0.2" filter="url(#faceBlur)"/>
						<ellipse cx="${cx-wChub*0.55}" cy="${cy-hChub*0.02}" rx="${wChub*0.22}" ry="${hChub*0.07}" fill="${skinLight}" opacity="0.3" filter="url(#faceBlur)"/>
						<ellipse cx="${cx+wChub*0.55}" cy="${cy-hChub*0.02}" rx="${wChub*0.22}" ry="${hChub*0.07}" fill="${skinLight}" opacity="0.3" filter="url(#faceBlur)"/>
						<ellipse cx="${cx-wChub*0.9}" cy="${cy-hChub*0.4}" rx="${wChub*0.14}" ry="${hChub*0.25}" fill="${skinDark}" opacity="0.25" filter="url(#faceBlur)"/>
						<ellipse cx="${cx+wChub*0.9}" cy="${cy-hChub*0.4}" rx="${wChub*0.14}" ry="${hChub*0.25}" fill="${skinDark}" opacity="0.25" filter="url(#faceBlur)"/>
						<rect x="0" y="0" width="400" height="520" filter="url(#skinTex)" opacity="0.55"/>
					</g>
					<ellipse cx="${cx}" cy="${cy+hChub*0.85}" rx="${wChub*0.7}" ry="${hChub*0.2}" fill="url(#chinShadow)" opacity="0.5"/>
					<ellipse cx="${cx-wChub*0.55}" cy="${cy+hChub*0.05}" rx="${wChub*0.25}" ry="${hChub*0.15}" fill="url(#cheekL)"/>
					<ellipse cx="${cx+wChub*0.55}" cy="${cy+hChub*0.05}" rx="${wChub*0.25}" ry="${hChub*0.15}" fill="url(#cheekR)"/>
					${wrinkles}
					${hair}
					${noseUnderShadow}
					${eyes}
					${brows}
					${browHairs}
					${nose}
					${mouth}
					<ellipse cx="${cx-mouthW-1}" cy="${mouthY+yC}" rx="3" ry="2.5" fill="${skinDark}" opacity="0.35" filter="url(#faceBlur)"/><ellipse cx="${cx+mouthW+1}" cy="${mouthY+yC}" rx="3" ry="2.5" fill="${skinDark}" opacity="0.35" filter="url(#faceBlur)"/>
					${beard}
					${moles}
					${freck}
					${scar}
					${glasses}
				`;
			}

			function update(){
				readState();
				document.getElementById('face').innerHTML = buildFace();
			}

			function randomize(){
				const rand = (min, max) => Math.floor(Math.random()*(max - min + 1)) + min;
				const skinTones = ["#f1c27d","#e8b890","#e0ac69","#c68642","#8d5524","#f5d0a9","#d4a373","#a67b5b","#6b4423"];
				const hairColors = ["#3a2820","#1a1a1a","#8b4513","#d4a017","#a52a2a","#c0c0c0","#ffffff","#b87333"];
				const beardColors = ["#3a2820","#1a1a1a","#8b4513","#c0c0c0","#ffffff","#a52a2a"];
				document.getElementById('faceShape').value = rand(0,7);
				document.getElementById('faceWidth').value = rand(80,125);
				document.getElementById('faceHeight').value = rand(85,120);
				document.getElementById('skinColor').value = skinTones[rand(0, skinTones.length-1)];
				document.getElementById('age').value = rand(18,80);
				document.getElementById('chubbiness').value = rand(-20, 20);
				document.getElementById('eyeShape').value = rand(0,4);
				document.getElementById('eyeDist').value = rand(80,120);
				document.getElementById('eyeSize').value = rand(80,120);
				document.getElementById('eyeHeight').value = rand(90,110);
				document.getElementById('eyeColor').value = ["#6b4423","#3a5f8a","#4a7a4a","#2b2b2b","#8a7a5a","#7a8a9a","#5b3a8a","#2e8b8b"][rand(0,7)];
				document.getElementById('pupilSize').value = rand(70,130);
				document.getElementById('freckles').value = rand(0,3) === 0 ? rand(10,80) : 0;
				document.getElementById('scar').value = rand(0,4) === 0 ? rand(1,5) : 0;
				document.getElementById('browThick').value = rand(2,8);
				document.getElementById('browAngle').value = rand(-15,15);
				document.getElementById('browColor').value = hairColors[rand(0, hairColors.length-1)];
				document.getElementById('noseLen').value = rand(85,115);
				document.getElementById('noseWidth').value = rand(80,125);
				document.getElementById('noseStyle').value = rand(0,4);
				document.getElementById('mouthWidth').value = rand(80,120);
				document.getElementById('smile').value = rand(-60,80);
				document.getElementById('lipSize').value = rand(70,130);
				document.getElementById('lipColor').value = ["#b86858","#a05040","#c07060","#9a5545"][rand(0,3)];
				document.getElementById('hairStyle').value = rand(0,10);
				document.getElementById('hairColor').value = hairColors[rand(0, hairColors.length-1)];
				document.getElementById('baldness').value = rand(0,60);
				document.getElementById('beardStyle').value = rand(0,8);
				document.getElementById('beardColor').value = beardColors[rand(0, beardColors.length-1)];
				document.getElementById('earSize').value = rand(85,125);
				document.getElementById('moles').value = rand(0,3);
				document.getElementById('wrinkles').value = rand(0, 60);
				document.getElementById('glasses').value = rand(0,6);
				newName();
				update();
			}

			function resetAll(){
				for(const k in defaults){
					const el = document.getElementById(k);
					if(el){
						el.value = defaults[k];
					}
				}
				update();
			}

			function serializeFace(withBg){
				const clone = document.getElementById('face').cloneNode(true);
				clone.setAttribute('width', '400');
				clone.setAttribute('height', '520');
				clone.removeAttribute('id');
				if(withBg){
					clone.insertAdjacentHTML('afterbegin', '<rect x="0" y="0" width="400" height="520" fill="#c8c8c8"/>');
				}
				return new XMLSerializer().serializeToString(clone);
			}

			function exportPNG(){
				const svgData = serializeFace(false);
				const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
				const url = URL.createObjectURL(svgBlob);
				const img = new Image();
				img.onload = function(){
					const canvas = document.createElement('canvas');
					canvas.width = 800; canvas.height = 1040;
					const ctx = canvas.getContext('2d');
					const grad = ctx.createRadialGradient(400, 400, 50, 400, 400, 600);
					grad.addColorStop(0, '#e8e8e8');
					grad.addColorStop(1, '#b0b0b0');
					ctx.fillStyle = grad;
					ctx.fillRect(0,0,800,1040);
					ctx.drawImage(img, 0, 0, 800, 1040);
					URL.revokeObjectURL(url);
					const link = document.createElement('a');
					link.download = `identikit_${suspectCode}.png`;
					link.href = canvas.toDataURL('image/png');
					link.click();
				};
				img.src = url;
			}

			function exportSVG(){
				const svgData = serializeFace(true);
				const blob = new Blob([svgData], {type: 'image/svg+xml'});
				const link = document.createElement('a');
				link.download = `identikit_${suspectCode}.svg`;
				link.href = URL.createObjectURL(blob);
				link.click();
				setTimeout(() => URL.revokeObjectURL(link.href), 1000);
			}

			newName();
			update();
		</script>
	</body>
</html>
