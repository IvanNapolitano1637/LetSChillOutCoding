		<style>
		:root{
			--bg: #f4f6fb;
			--fg: #1c2230;
			--card: #fff;
			--ac: #2563eb;
			--bd: #d5dae6;
			--alt: #f0f3fa;
		}
		@media(prefers-color-scheme:dark){
			:root{
			--bg: #10141c;
			--fg: #e6e9f0;
			--card: #1a2030;
			--ac: #7aa6ff;
			--bd: #2c3550;
			--alt: #1f2638;
			}
		}
		*{
			box-sizing: border-box;
		}
		body{
			margin: 0;
			padding: 14px 12px 40px;
			font: 15px/1.5 system-ui, sans-serif;
			background: var(--bg);
			color: var(--fg);
		}
		h1{
			margin: 0 0 4px;
			font-size: 22px;
		}
		p{
			margin: 0 0 12px;
			opacity: .7;
		}
		.wrap{
			max-width: 900px;
			margin: auto;
			overflow-x: auto;
			border: 1px solid var(--bd);
			border-radius: 12px;
			background: var(--card);
		}
		table{
			width: 100%;
			border-collapse: collapse;
		}
		th,
		td{
			padding: 10px 12px;
			text-align: left;
			border-bottom: 1px solid var(--bd);
		}
		tbody tr:nth-child(even){
			background: var(--alt);
		}
		tbody tr:last-child td{
			border-bottom: 0;
		}
		th{
			cursor: pointer;
			user-select: none;
			white-space: nowrap;
			position: sticky;
			top: 0;
			background: var(--card);
		}
		th:hover{
			color: var(--ac);
		}
		th .arrow{
			display: inline-block;
			width: 1em;
			color: var(--ac);
		}
		@media(max-width:600px){
			body{
				font-size: 14px;
			}
			th,
			td{
				padding: 8px 6px;
			}
		}
		</style>
	</head>

				{number: "054", code: "K07", name_1: "Francesco", name_2: "Pinball.html"}
			];
			const columns = [['number', 'Numero'], ['code', 'Codice'], ['name_1', 'Nome umano'], ['name_2', 'Nome pagina']];
			let sortKey = null, direction = 1;
			const head = document.getElementById('head');
			const body = document.getElementById('body');

			columns.forEach(([field, label]) => {
				const th = document.createElement('th');
				th.innerHTML = label + ' <span class = arrow></span>';
				th.onclick = () => {
					if(sortKey === field){
						direction = -direction;
					}else{
						sortKey = field;
						direction = 1;
					}
					render();
				};
				head.append(th);
			});

			function render(){
				const compare = (a, b) => a.localeCompare(b, 'it', {sensitivity: 'base'});
				const rows = data.slice();
				if(sortKey){
					rows.sort((a, b) => direction*compare(a[sortKey], b[sortKey]));
				}
				body.innerHTML = '';
				rows.forEach(row => {
					const tr = document.createElement('tr');
					columns.forEach(([field]) => {
						const td = document.createElement('td');
						td.textContent = row[field];
						tr.append(td);
					});
					body.append(tr);
				});
				columns.forEach(([field], i) => {
					head.children[i].querySelector('.arrow').textContent = field === sortKey ? (direction > 0 ? '▲': '▼'): ''
				})
			}

			render();
		</script>
	</body>
</html>
