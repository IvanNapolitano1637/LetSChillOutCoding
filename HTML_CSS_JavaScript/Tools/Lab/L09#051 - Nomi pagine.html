			.wrap{

				margin: auto;
				overflow-x: auto;
				border: 1px solid var(--bd);
				border-radius: 12px;
				background: var(--card);
			}
			table{
				width: 100%;
				border-collapse: collapse;
			}
			th, td{
				padding: 10px 12px;
				text-align: left;
				border-bottom: 1px solid var(--bd);
			}
			tbody tr:nth-child(even){
				background: var(--alt);
			}
			tbody tr:last-child td{
				border-bottom: 0;
			}
			th{
				cursor: pointer;
				user-select: none;
				white-space: nowrap;
				position: sticky;
				top: 0;
				background: var(--card);
			}
			th:hover{
				color: var(--ac);
			}
			th .arrow{
				display: inline-block;
				width: 1em;
				color: var(--ac);
			}
			@media(max-width:600px){

				}
				th, td{

			const columns = [
				['number', 'Numero'],
				['code', 'Codice'],
				['name_1', 'Nome umano'],
				['name_2', 'Nome pagina'],
				['size', 'Dimensione (kB)']
			];
			const numericFields = new Set(['number', 'size']);
			let sortKey = null, direction = 1;
			const head = document.getElementById('head');
			const body = document.getElementById('body');

			columns.forEach(([field, label]) => {
				const th = document.createElement('th');
				th.innerHTML = label + ' <span class="arrow"></span>';
				th.onclick = () => {
					if(sortKey === field){
						direction = -direction;
					}else{
						sortKey = field;
						direction = 1;
					}
					render();
				};
				head.append(th);
			});

			function compareValues(valA, valB, isNumeric){
				if(isNumeric){
					const numA = Number(valA);
					const numB = Number(valB);
					const isNaNA = Number.isNaN(numA);
					const isNaNB = Number.isNaN(numB);
					if(isNaNA && isNaNB){
						return 0;
					}
					if(isNaNA){
						return 1;
					}
					if(isNaNB){
						return -1;
					}
					return numA - numB;
				}
				return String(valA ?? '').localeCompare(String(valB ?? ''), 'it', { sensitivity: 'base' });
			}

			function render(){
				const rows = data.slice();
				if(sortKey){
					const isNumeric = numericFields.has(sortKey);
					rows.sort((a, b) => direction*compareValues(a[sortKey], b[sortKey], isNumeric));
				}
				body.innerHTML = '';
				rows.forEach(row => {
					const tr = document.createElement('tr');
					columns.forEach(([field]) => {
						const td = document.createElement('td');
						td.textContent = row[field];
						tr.append(td);
					});
					body.append(tr);
				});
				columns.forEach(([field], i) => {
					head.children[i].querySelector('.arrow').textContent = field === sortKey ? (direction > 0 ? '▲' : '▼') : '';
				});
			}

			render();
